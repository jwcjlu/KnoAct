<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知学伴 · AI 学习伙伴</title>
<style>
  :root{
    --blue:#3158e8; --blue2:#4566e8; --blue3:#3d66f5; --blue4:#5574e9; --blue5:#5b77eb;
    --blue-soft:#edf1ff; --blue-soft2:#f5f7ff; --blue-soft3:#f1f4ff; --blue-border:#8ea2ef;
    --green:#2e8b5a; --green2:#2e9b62; --green-soft:#e8f7ef; --green-soft2:#eaf7ef;
    --orange:#dc872d; --orange2:#c97629; --orange3:#d57f2c; --orange-soft:#fff2df; --orange-soft2:#fff1df;
    --gold:#ffc45c; --gold2:#ffad27; --gold3:#f59d20;
    --purple:#7457d7; --purple-soft:#f0edff;
    --bg:#f7f8f5; --card:#fff;
    --ink:#202723; --ink2:#354038; --ink3:#4b544e;
    --gray:#78817b; --gray2:#8a928d; --gray3:#9aa19c; --gray4:#a0a7a2;
    --line:#e3e7e0; --line2:#e2e6e0; --line3:#e1e5df;
    --dark-card:#202c28;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  button{cursor:pointer;font-family:inherit;border:none;background:none}
  .serif{font-family:Georgia,"Songti SC","SimSun",serif}

  /* 布局 */
  .layout{display:flex;min-height:100vh}
  .sidebar{position:fixed;inset-y:0;left:0;width:232px;background:var(--card);border-right:1px solid var(--line);padding:28px 20px;display:flex;flex-direction:column;z-index:20}
  .main{flex:1;margin-left:232px;padding:24px 40px 56px;max-width:1440px}

  /* 侧边栏 */
  .logo{display:flex;align-items:center;gap:12px;padding:0 8px}
  .logo-badge{width:40px;height:40px;border-radius:12px;background:var(--blue3);color:#fff;display:grid;place-items:center}
  .logo-name{font-size:18px;font-weight:700;letter-spacing:-.02em}
  .logo-sub{font-size:11px;color:#8a938d}
  .nav{margin-top:40px;display:flex;flex-direction:column;gap:8px}
  .nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:500;color:#69716c;transition:.15s;text-align:left}
  .nav-item:hover{background:#f4f5f3}
  .nav-item.active{background:var(--blue-soft);color:var(--blue)}
  .nav-item svg{flex-shrink:0}
  .ai-tip{margin-top:auto;border-radius:16px;background:var(--blue-soft3);padding:16px}
  .ai-tip-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--blue);margin-bottom:8px}
  .ai-tip p{font-size:12px;line-height:20px;color:#626d7e}
  .user-row{margin-top:20px;display:flex;align-items:center;gap:12px;border-top:1px solid #edf0ec;padding:20px 8px 0}
  .avatar{width:36px;height:36px;border-radius:50%;background:#ffe5c7;color:#a85a23;display:grid;place-items:center;font-weight:700;font-size:14px}
  .user-name{font-size:14px;font-weight:600}
  .user-grade{font-size:12px;color:var(--gray3)}

  /* 顶部 header */
  .page-head{display:flex;align-items:center;justify-content:space-between}
  .page-head .date{font-size:14px;color:var(--gray)}
  .page-head h1{margin-top:4px;font-size:30px;font-weight:700;letter-spacing:-.025em}
  .head-right{display:flex;align-items:center;gap:12px}
  .points-pill{display:flex;align-items:center;gap:8px;border:1px solid #e2e5e1;background:var(--card);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .points-pill .star{color:var(--gold2)}

  /* 通用 */
  .section-title{display:flex;align-items:flex-end;justify-content:space-between}
  .section-title h2{font-size:20px;font-weight:700}
  .section-title .sub{margin-top:4px;font-size:14px;color:var(--gray2)}
  .badge-blue{background:var(--blue-soft);color:var(--blue2)}
  .badge-green{background:var(--green-soft);color:var(--green)}
  .badge-orange{background:var(--orange-soft);color:var(--orange2)}

  /* Hero 卡片 */
  .hero-grid{display:grid;grid-template-columns:1.55fr .75fr;gap:20px;margin-top:28px}
  .hero{position:relative;overflow:hidden;border-radius:26px;background:var(--blue);color:#fff;padding:32px 36px;box-shadow:0 14px 35px rgba(49,88,232,.18)}
  .hero .tag{display:inline-flex;align-items:center;gap:8px;border-radius:999px;background:rgba(255,255,255,.15);padding:6px 12px;font-size:12px;font-weight:500;margin-bottom:16px}
  .hero h2{font-size:28px;font-weight:700;line-height:1.35;max-width:520px}
  .hero p{margin-top:8px;font-size:14px;line-height:24px;color:#c4d0ff;max-width:520px}
  .hero .start-btn{margin-top:24px;display:inline-flex;align-items:center;gap:8px;border-radius:12px;background:#fff;color:var(--blue);padding:12px 20px;font-size:14px;font-weight:700;transition:.15s}
  .hero .start-btn:hover{transform:translateY(-2px)}
  .hero .deco-ring{position:absolute;bottom:-96px;right:-48px;width:288px;height:288px;border-radius:50%;border:44px solid rgba(255,255,255,.1)}
  .hero .deco-glow{position:absolute;right:80px;top:32px;width:96px;height:96px;border-radius:50%;background:rgba(102,130,240,.6);filter:blur(24px)}
  .hero .deco-icon{position:absolute;bottom:28px;right:40px;transform:rotate(6deg);border-radius:16px;background:rgba(255,255,255,.1);padding:20px;backdrop-filter:blur(4px);display:none}

  .weekly-card{border-radius:26px;border:1px solid var(--line);background:var(--card);padding:24px}
  .weekly-card .head{display:flex;justify-content:space-between;align-items:center}
  .weekly-card .head h2{font-weight:700;font-size:16px}
  .weekly-card .head span{font-size:12px;color:var(--gray2)}
  .bars{margin-top:28px;display:flex;align-items:flex-end;justify-content:space-between}
  .bar{display:flex;flex-direction:column;align-items:center;gap:8px}
  .bar .track{position:relative;height:96px;width:20px;border-radius:999px;background:#eef0ed;display:flex;align-items:flex-end;overflow:hidden}
  .bar .fill{width:100%;border-radius:999px}
  .bar span{font-size:11px;color:var(--gray3)}
  .bar.today span{font-weight:700;color:var(--blue)}
  .streak{margin-top:20px;display:flex;align-items:center;gap:8px;border-radius:12px;background:#fff7e9;padding:10px 12px;font-size:12px;color:#8d652a}

  /* 任务 */
  .tasks-section{margin-top:36px}
  .task-info{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:24px;border:1px solid #dfe4f5;background:var(--blue-soft2);padding:16px 20px;border-radius:16px}
  .task-info .lead{display:flex;align-items:center;gap:12px}
  .task-info .lead .ic{width:36px;height:36px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center}
  .task-info .lead .t1{font-size:14px;font-weight:700}
  .task-info .lead .t2{font-size:12px;color:#7d879d}
  .divider{width:1px;height:32px;background:#dce1ef}
  .composition{flex:1;min-width:280px;display:flex;align-items:center;gap:12px}
  .composition .lbl{font-size:12px;font-weight:600;color:#5e687c;white-space:nowrap}
  .comp-bar{flex:1;height:8px;border-radius:999px;background:#e0e4ee;display:flex;overflow:hidden}
  .comp-bar .seg1{width:70%;background:var(--blue4)}
  .comp-bar .seg2{width:30%;background:#54aa78}
  .comp-legend{font-size:12px;color:#69748a;white-space:nowrap}
  .comp-legend b{color:var(--blue2)}
  .comp-legend b.g{color:#329260}
  .due-pill{display:flex;align-items:center;gap:8px;border-radius:999px;background:#fff;padding:8px 12px;font-size:12px;color:#5e687c}

  .task-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
  .task-card{border:1px solid var(--line2);background:var(--card);border-radius:16px;padding:20px;transition:.15s}
  .task-card:hover{transform:translateY(-2px);box-shadow:0 10px 15px -3px rgba(0,0,0,.1)}
  .task-card .top{display:flex;align-items:flex-start;gap:16px}
  .task-ic{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex-shrink:0}
  .task-ic.blue{background:var(--blue-soft);color:var(--blue2)}
  .task-ic.orange{background:var(--orange-soft);color:var(--orange)}
  .task-ic.green{background:var(--green-soft);color:var(--green2)}
  .task-card .t-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .task-tag{font-size:10px;font-weight:700;border-radius:999px;padding:4px 8px}
  .task-card h3{font-size:15px;font-weight:700}
  .task-card .detail{margin-top:4px;font-size:14px;color:#7e8781}
  .task-card .foot{margin-top:16px;display:flex;justify-content:space-between;align-items:center}
  .task-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray3)}
  .task-points{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#dc8b22}
  .task-btn{margin-top:20px;width:100%;border-radius:12px;padding:10px;font-size:14px;font-weight:600;text-align:center;transition:.15s}
  .task-btn.todo{background:#f2f4f1;color:#4b544e}
  .task-btn.todo:hover{background:var(--blue);color:#fff}
  .task-btn.done{background:var(--green-soft2);color:var(--green)}

  /* 智能复习 + 积分兑换 */
  .review-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;margin-top:36px}
  .review-card{border:1px solid var(--line2);background:var(--card);border-radius:24px;padding:24px}
  .review-card .head{display:flex;justify-content:space-between;align-items:center}
  .review-card .head h2{font-size:18px;font-weight:700}
  .review-card .head .sub{margin-top:4px;font-size:14px;color:var(--gray2)}
  .head-ic{width:40px;height:40px;border-radius:12px;background:var(--purple-soft);color:var(--purple);display:grid;place-items:center}
  .review-items{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .review-item{display:flex;align-items:center;gap:16px;border:1px solid #e7e9e6;border-radius:16px;padding:16px;text-align:left;transition:.15s}
  .review-item:hover{border-color:var(--blue-border)}
  .review-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;font-weight:700;flex-shrink:0}
  .review-ic.yw{background:var(--blue-soft);color:var(--blue2)}
  .review-ic.en{background:var(--orange-soft2);color:var(--orange3)}
  .review-item .name{font-size:14px;font-weight:700}
  .review-item .cnt{margin-top:4px;font-size:12px;color:#8e9691}

  .redeem-card{border-radius:24px;background:var(--dark-card);color:#fff;padding:24px}
  .redeem-card .head{display:flex;justify-content:space-between;align-items:flex-start}
  .redeem-card .lbl{font-size:12px;font-weight:500;color:#9daba5}
  .redeem-card h2{margin-top:4px;font-size:18px;font-weight:700}
  .redeem-card .pts{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:var(--gold)}
  .redeem-items{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .redeem-item{border-radius:16px;background:rgba(255,255,255,.1);padding:16px;text-align:left;transition:.15s}
  .redeem-item:hover{background:rgba(255,255,255,.15)}
  .redeem-item .name{margin-top:16px;font-size:14px;font-weight:700}
  .redeem-item .cost{margin-top:4px;font-size:12px;color:var(--gold)}

  /* 页头面包屑（子页通用） */
  .crumb{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--blue)}
  .page-head h1.big{margin-top:8px;font-size:30px;font-weight:700;letter-spacing:-.025em}
  .page-head .desc{margin-top:8px;font-size:14px;color:var(--gray)}

  /* 个性化学习 */
  .pl-grid{display:grid;grid-template-columns:1.55fr .8fr;gap:20px;margin-top:28px;min-height:680px}
  .pl-reader{border:1px solid var(--line3);background:var(--card);border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
  .pl-reader .bar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e7eae6;padding:16px 20px}
  .pl-reader .bar .t{display:flex;align-items:center;gap:12px;min-width:0}
  .pl-reader .bar .ic{width:36px;height:36px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex-shrink:0}
  .pl-reader .bar .name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-reader .bar .sub{font-size:12px;color:#929a94}
  .reader-body{flex:1;background:#eceeea;display:flex;justify-content:center;padding:24px;overflow:auto}
  .reader-page{width:100%;max-width:620px;min-height:760px;background:#fff;padding:48px 64px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .reader-page .unit{text-align:center;font-size:12px;font-weight:600;letter-spacing:.3em;color:#83918a}
  .reader-page h2{margin-top:16px;text-align:center;font-size:30px;font-weight:700}
  .reader-page .body{margin-top:24px;font-size:15px;line-height:30px;color:var(--ink2)}
  .pl-side{display:flex;flex-direction:column;gap:20px}
  .pl-ask{border:1px solid var(--line3);background:var(--card);border-radius:24px;padding:20px}
  .pl-ask h3{font-size:16px;font-weight:700}
  .pl-ask .ta{margin-top:12px;width:100%;min-height:110px;border:1px solid var(--line3);border-radius:12px;padding:12px;font-size:13px;font-family:inherit;resize:vertical;color:var(--ink)}
  .pl-ask .ta:focus{outline:none;border-color:var(--blue-border)}
  .quick-actions{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
  .qa-btn{border:1px solid var(--line3);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--ink3);transition:.15s}
  .qa-btn:hover{border-color:var(--blue-border);color:var(--blue)}
  .pl-question{border:1px solid var(--line3);background:var(--card);border-radius:24px;padding:20px}
  .pl-question h3{font-size:16px;font-weight:700}
  .pl-question .qa-input{margin-top:12px;display:flex;gap:8px}
  .pl-question input{flex:1;border:1px solid var(--line3);border-radius:12px;padding:10px 12px;font-size:13px;font-family:inherit}
  .pl-question input:focus{outline:none;border-color:var(--blue-border)}
  .send-btn{border-radius:12px;background:var(--blue);color:#fff;padding:0 20px;font-size:14px;font-weight:600}
  .pl-answer{border:1px solid var(--line3);background:#fafbf9;border-radius:24px;padding:20px}
  .pl-answer h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
  .pl-answer .ans{margin-top:12px;font-size:13px;line-height:22px;color:var(--ink3)}

  /* 教材列表 */
  .materials{margin-top:28px;border:1px solid var(--line3);background:var(--card);border-radius:24px;padding:20px}
  .materials .head{display:flex;justify-content:space-between;align-items:center}
  .materials .head h2{font-size:16px;font-weight:700}
  .materials .head .sub{margin-top:4px;font-size:12px;color:#8e9691}
  .add-book{display:inline-flex;align-items:center;gap:8px;border:1px solid #dfe3de;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;color:#4f5952;transition:.15s}
  .add-book:hover{border-color:var(--blue-border);color:var(--blue)}
  .book-list{margin-top:16px;display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
  .book-card{min-width:210px;display:flex;align-items:center;gap:12px;border:1px solid #e4e7e3;border-radius:16px;padding:12px;text-align:left;transition:.15s}
  .book-card.active{border-color:#6f88ed;background:var(--blue-soft2);box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .book-spine{width:44px;height:56px;border-radius:8px;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
  .book-spine.blue{background:var(--blue4)}
  .book-spine.orange{background:#ed9848}
  .book-spine.green{background:#45a879}
  .book-card .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .book-card .tp{margin-top:4px;font-size:12px;color:#929a94}

  /* 错题本 */
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
  .stat-card{border:1px solid var(--line3);background:var(--card);border-radius:16px;padding:20px}
  .stat-card .t{font-size:14px;color:#7e8781}
  .stat-card .row{margin-top:8px;display:flex;align-items:flex-end;justify-content:space-between}
  .stat-card .v{font-size:24px;font-weight:700}
  .stat-card .d{border-radius:999px;padding:4px 10px;font-size:12px}
  .wrong-list{margin-top:24px;border:1px solid var(--line3);background:var(--card);border-radius:24px;padding:24px}
  .wrong-list .head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
  .wrong-list .head h2{font-size:18px;font-weight:700}
  .wrong-list .head .sub{margin-top:4px;font-size:12px;color:#8e9691}
  .filter{display:flex;border-radius:12px;background:#f2f4f1;padding:4px}
  .filter button{border-radius:10px;padding:8px 16px;font-size:12px;font-weight:600;color:#778079}
  .filter button.active{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .wrong-items{margin-top:20px;display:flex;flex-direction:column;gap:16px}
  .wrong-card{border:1px solid var(--line);border-radius:16px;padding:20px}
  .wrong-card .top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
  .wrong-card .meta{display:flex;align-items:center;gap:8px}
  .wrong-card .subj-tag{border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700}
  .wrong-card .src{font-size:12px;color:#808983}
  .wrong-card .date{font-size:12px;color:var(--gray4)}
  .wrong-card .q{margin-top:16px;font-size:15px;font-weight:600;line-height:28px}
  .wrong-ans{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .wa{border-radius:12px;padding:12px 16px}
  .wa.bad{background:#fff3f0}
  .wa.good{background:#eef8f2}
  .wa .lbl{font-size:11px;font-weight:700}
  .wa.bad .lbl{color:#b65f52}
  .wa.good .lbl{color:#39815a}
  .wa .val{margin-top:4px;font-size:14px}
  .wa.bad .val{color:#704a44}
  .wa.good .val{color:#3d5e4b}
  .wrong-card .foot{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
  .wrong-card .reason{display:flex;align-items:center;gap:8px;font-size:12px;color:#747e77}
  .wrong-card .reason b{font-weight:700}
  .wrong-card .actions{display:flex;gap:8px}
  .btn-ghost{border:1px solid #dfe3de;border-radius:12px;padding:8px 16px;font-size:12px;font-weight:600;color:#59625c}
  .btn-ghost:hover{background:#f5f6f4}
  .btn-primary{border-radius:12px;background:var(--blue);color:#fff;padding:8px 16px;font-size:12px;font-weight:600}

  /* 提示 toast */
  .toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:50;border-radius:999px;background:var(--dark-card);color:#fff;padding:12px 20px;font-size:14px;font-weight:600;box-shadow:0 20px 25px -5px rgba(0,0,0,.2);display:none}

  /* 学习中心 / 学习报告 / 积分商城 占位补充页 */
  .placeholder-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;color:var(--gray)}
  .placeholder-page .ic{width:72px;height:72px;border-radius:24px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;margin-bottom:20px}
  .placeholder-page h2{font-size:22px;font-weight:700;color:var(--ink)}
  .placeholder-page p{margin-top:8px;font-size:14px}

  /* 听写练习 */
  .dict-wrap{max-width:720px;margin:0 auto}
  .dict-progress{margin-top:28px;display:flex;align-items:center;gap:16px}
  .dict-progress .pbar{flex:1;height:8px;border-radius:999px;background:#e7eae6;overflow:hidden}
  .dict-progress .pfill{height:100%;background:var(--blue);transition:width .25s}
  .dict-progress .ptxt{font-size:13px;color:var(--gray2);white-space:nowrap}
  .dict-card{margin-top:24px;border:1px solid var(--line3);background:var(--card);border-radius:24px;padding:40px 32px;text-align:center}

  /* 模型与服务：左角色导航 + 右配置面板 */
  .ms-wrap{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;margin-top:24px;align-items:start}
  .ms-nav{border:1px solid var(--line3);background:var(--card);border-radius:20px;padding:12px;position:sticky;top:24px}
  .ms-nav .nav-title{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--gray3);padding:8px 10px 10px}
  .ms-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px 10px;border-radius:12px;font-size:13px;font-weight:600;color:var(--ink3);text-align:left;transition:.15s}
  .ms-item:hover{background:#f5f6f4}

  .ms-item .dot.ok{background:var(--green2)}
  .ms-item .dot.warn{background:var(--gold2)}
  .ms-item .dot.off{background:#d7dcd6}
  .ms-item .off-tag{margin-left:auto;font-size:10px;color:var(--gray3);font-weight:500;background:#f3f5f2;border-radius:6px;padding:2px 6px}

  .ms-main{border:1px solid var(--line3);background:var(--card);border-radius:24px;padding:24px}

  .ms-main .head .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
  .ms-main .head .ic.blue{background:var(--blue-soft);color:var(--blue2)}
  .ms-main .head .ic.green{background:var(--green-soft);color:var(--green2)}
  .ms-main .head .ic.purple{background:var(--purple-soft);color:var(--purple)}
  .ms-main .head .ic.orange{background:var(--orange-soft);color:var(--orange2)}
  .ms-main .head h3{font-size:16px;font-weight:700}
  .ms-main .head .sub{margin-top:2px;font-size:12px;color:#8e9691}

  .ms-field{margin-top:18px;max-width:560px}
  .ms-label{font-size:13px;color:var(--gray2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .ms-input,.ms-select{width:100%;border:1px solid var(--line3);border-radius:12px;padding:10px 12px;font-size:13px;font-family:inherit;background:var(--card);color:var(--ink)}
  .ms-input:focus,.ms-select:focus{outline:none;border-color:var(--blue-border);box-shadow:0 0 0 3px rgba(49,88,232,.08)}
  .ms-input:disabled,.ms-select:disabled{background:#f7f8f6;color:var(--gray3)}
  .ms-row{display:flex;gap:10px;align-items:center}
  .ms-hint{font-size:12px;color:var(--gray3);margin-top:6px;line-height:19px}

  .ms-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;margin-left:auto}
  .ms-badge.ok{background:var(--green-soft);color:var(--green)}
  .ms-badge.idle{background:#f3f5f2;color:var(--gray3)}
  .ms-badge.warn{background:var(--orange-soft);color:var(--orange2)}

  .ms-card{border:1px solid #e7e9e6;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}
  .ms-card+.ms-card{margin-top:10px}
  .ms-card .c-l{min-width:0;flex:1}
  .ms-card .c-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
  .ms-card .c-meta{margin-top:3px;font-size:12px;color:#8e9691;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ms-card .c-k{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--gray3)}

  .ms-empty{border:1px dashed #dfe4dd;border-radius:16px;padding:28px 16px;text-align:center;font-size:13px;color:var(--gray3)}

  .ms-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid #eef1ec}

  .parent-panel .head{display:flex;align-items:center;gap:12px}
  .parent-panel .head .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
  .parent-panel .head .ic.blue{background:var(--blue-soft);color:var(--blue2)}
  .parent-panel .head .ic.green{background:var(--green-soft);color:var(--green2)}
  .parent-panel .head .ic.purple{background:var(--purple-soft);color:var(--purple)}
  .parent-panel .head .ic.orange{background:var(--orange-soft);color:var(--orange2)}
  .parent-panel .head h3{font-size:16px;font-weight:700}
  .parent-panel .head .sub{margin-top:2px;font-size:12px;color:#8e9691}
  .parent-panel .bd{margin-top:16px}
  .lesson-steps{display:flex;flex-direction:column;gap:8px}
  .lesson-step{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink3)}
  .lesson-step .dot{width:8px;height:8px;border-radius:50%;background:var(--blue4)}
  .lesson-step .lnk{margin-left:auto;font-size:12px;color:var(--blue2);font-weight:600;cursor:pointer}
  .kw-chip-row{display:flex;flex-wrap:wrap;gap:8px}
  .kw-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--blue-soft);color:var(--blue2);padding:6px 12px;font-size:12px;font-weight:600}
  .kw-chip .del{cursor:pointer;opacity:.6}
  .kw-chip-add{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--blue-border);border-radius:999px;color:var(--blue2);padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
  .goal-list{display:flex;flex-direction:column;gap:12px}
  .goal-item{border:1px solid #e7e9e6;border-radius:14px;padding:14px 16px}
  .goal-item .g-top{display:flex;align-items:center;justify-content:space-between}
  .goal-item .g-name{font-size:14px;font-weight:700}
  .goal-item .g-status{font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px}
  .goal-item .g-bar{margin-top:10px;height:6px;border-radius:999px;background:#eef0ed;overflow:hidden}
  .goal-item .g-fill{height:100%;border-radius:999px}
  .goal-item .g-meta{margin-top:8px;font-size:12px;color:#8e9691}
  .weak-list{display:flex;flex-direction:column;gap:12px}
  .weak-row{display:flex;align-items:center;gap:12px}
  .weak-row .w-name{width:80px;font-size:13px;color:var(--ink3);flex-shrink:0}
  .weak-row .w-bar{flex:1;height:10px;border-radius:999px;background:#eef0ed;overflow:hidden}
  .weak-row .w-fill{height:100%;border-radius:999px;background:var(--orange)}
  .weak-row .w-val{width:56px;text-align:right;font-size:13px;font-weight:700;color:var(--orange2)}

  .rule-row .r-cost{margin-top:2px;font-size:12px;color:#8e9691}
  .rule-edit{font-size:12px;font-weight:600;color:var(--blue2);cursor:pointer}

  /* PDF 拆课 */
  .pdf-list{display:flex;flex-direction:column;gap:12px}
  .pdf-row{display:flex;align-items:center;gap:16px;border:1px solid #e7e9e6;border-radius:16px;padding:16px 20px}

  .pdf-row .st.processing{color:var(--orange2)}
  .pdf-row .st.done{color:var(--green)}
  .upload-drop{margin-top:16px;border:2px dashed var(--blue-border);border-radius:16px;padding:40px 24px;text-align:center;cursor:pointer;transition:.15s}
  .upload-drop:hover{border-color:var(--blue3);background:var(--blue-soft2)}

  .upload-drop .t{margin-top:12px;font-size:15px;font-weight:700}
  .upload-drop .s{margin-top:4px;font-size:12px;color:#8e9691}
  .lesson-confirm-list{display:flex;flex-direction:column;gap:12px}
  .lc-item{border:1px solid #e7e9e6;border-radius:16px;padding:16px 20px}

  .lc-item .ttl{font-size:14px;font-weight:700}
  .lc-item .pg{font-size:12px;color:#8e9691}
  .lc-item .st-badge{font-size:11px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}

  .lc-item .ex-actions{margin-top:14px;display:flex;justify-content:flex-end;gap:8px}
  .pdf-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--blue2);cursor:pointer;margin-top:16px}

  /* 学习进度推进 */
  .progress-strip{margin-top:20px;border:1px solid var(--line3);background:var(--card);border-radius:16px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}

  .progress-strip .p-title{font-size:14px;font-weight:700}
  .progress-strip .p-sub{margin-top:2px;font-size:12px;color:#8e9691}
  .progress-strip .p-bar{flex:1;max-width:280px;height:8px;border-radius:999px;background:#eef0ed;overflow:hidden}

// ===== 听写练习 =====
function startDictation(){
  dictState = {idx:0, phase:'listen', wrong:[], correct:0, tried:false, input:''};
  setPage('听写练习');
}
function dictWord(){ return dictationWords[dictState.idx]; }
function speakDict(){
  const w = dictWord();
  if(window.speechSynthesis){
    const u = new SpeechSynthesisUtterance(w.w);
    u.lang = 'zh-CN'; u.rate = 0.9;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }
  const btn = document.querySelector('.dict-play');
  if(btn){ btn.classList.add('playing'); btn.innerHTML = icon('headphones',17)+'播放中…';
    setTimeout(()=>{ const b=document.querySelector('.dict-play'); if(b){ b.classList.remove('playing'); b.innerHTML = icon('headphones',17)+'再听一遍'; } },1600);
  }
}
function dictInput(v){ if(dictState) dictState.input = v; }
function submitDict(){
  const s = dictState, w = dictWord();
  const right = s.input.trim() === w.w;
  s.tried = true; s.phase = 'feedback';
  if(right){ s.correct++; }
  else { s.wrong.push({word:w.w, pinyin:w.pinyin, meaning:w.meaning, yours:s.input.trim()}); }
  render();
}
function dictNext(){
  const s = dictState;
  s.idx++;
  if(s.idx >= dictationWords.length){ s.phase='done'; }
  else { s.phase='listen'; s.tried=false; s.input=''; }
  render();
}
function renderDictation(){
  const s = dictState;
  if(!s) return '<div class="placeholder-page"><h2>听写练习</h2><p>请从首页点击任务进入。</p></div>';

  const total = dictationWords.length;
  const progress = Math.round(s.idx / total * 100);

  // 完成页
  if(s.phase==='done'){
    const wrongCount = s.wrong.length;
    return `<header class="page-head"><div><h1>第 12 课生词听写</h1></div></header>
    <div class="dict-wrap">
      <div class="dict-done">
        <div class="big">${icon('check',24)} 听写完成！</div>
        <div class="sub">本次共听写 ${total} 个生词</div>
        <div class="stat">
          <div><div class="k">正确</div><div class="v g">${s.correct}</div></div>
          <div><div class="k">错误</div><div class="v r">${wrongCount}</div></div>
        </div>
        <p style="margin-top:20px;font-size:13px;color:var(--gray2)">${wrongCount?`${wrongCount} 个错词已自动收录进错题本`:'全部正确，继续保持！'}</p>
        <button class="dict-next" onclick="finishTask(1,20); setPage('学习首页')">${icon('star',17)} 完成打卡 +20 积分</button>
      </div>
    </div>`;
  }

  const w = dictWord();
  const feedback = s.phase==='feedback' ? (()=>{
    const right = !s.wrong.some(x=>x.word===w.w);
    return `<div class="dict-feedback ${right?'right':'wrong'}">
      <div class="fb-head">${right?icon('check',18)+'回答正确':icon('pen',18)+'写错了，看这里'}</div>
      <div class="fb-body">${right?`「${w.w}」拼写正确，${w.meaning}`:`正确写法是「${w.w}」（${w.pinyin}）<br>${w.meaning}`}</div>
    </div>
    <button class="dict-next" onclick="dictNext()">${s.idx===total-1?'查看结果':'下一个词'} ${icon('arrow',16)}</button>`;
  })() : '';

  return `<header class="page-head">
    <div><h1>第 12 课生词听写</h1></div>
    <button class="btn-ghost" onclick="setPage('学习首页')">退出练习</button>
  </header>
  <div class="dict-wrap">
    <div class="dict-progress">
      <span class="ptxt">第 ${s.idx+1} / ${total} 个</span>
      <div class="pbar"><div class="pfill" style="width:${progress}%"></div></div>
      <span class="ptxt">${total-s.idx} 个剩余</span>
    </div>
    <div class="dict-card">
      <div class="dict-word-ic">${icon('headphones',40)}</div>
      <div class="dict-hint">点击播放，听写这个词</div>
      <button class="dict-play" onclick="speakDict()">${icon('play',17)} 播放词语</button>
      <div style="margin-top:24px">
        <input class="dict-input" placeholder="输入你听到的词语" value="${s.input}" oninput="dictInput(this.value)" ${s.phase==='feedback'?'disabled':''}>
      </div>
      <button class="dict-enter" onclick="submitDict()" ${s.phase==='feedback'||!s.input.trim()?'disabled':''}>确认提交</button>
      ${feedback}
    </div>
  </div>`;
}

function startNewLesson(){ nlState = {phase:'read', picks:[], result:null, pass:false}; setPage('新课学习'); }
function nlStartQuiz(){ nlState.phase='quiz'; render(); }
function nlPick(qi, oi){ nlState.picks[qi]=oi; render(); }
function nlSubmit(){
  const s=nlState; let right=0;
  newLesson.questions.forEach((q,i)=>{ if(s.picks[i]===q.ans) right++; });
  const total=newLesson.questions.length;
  const rate=right/total;
  s.pass = rate >= 0.6;
  s.result={right,total,rate};
  render();
}
function nlAdvance(){
  lessonProgress.current += 1; lessonProgress.mastered += 1;
  finishTask(1, 20);
  setPage('学习首页'); toast('进度已推进到第 '+(lessonProgress.current+1)+' 课');
}
function nlRetryRead(){ nlState.phase='read'; nlState.picks=[]; nlState.result=null; render(); }

function nlNoteHint(){ toast('划词记笔记：先用鼠标选中教材里的一段文字'); }

               ${models.map(m=>`<option value="${m}" ${s.model===m?'selected':''}>${m}</option>`).join('')}
             </select>`
          : `<input class="ms-input" value="${s.model}" placeholder="先选提供方，或手填模型名" oninput="setRoleModel('${r.id}', this.value)">`}
        <button class="btn-ghost" style="white-space:nowrap" onclick="probeRole('${r.id}')">拉取模型</button>
      </div>
      <div class="ms-hint">${probeState[r.id] ? probeState[r.id].msg : '选择提供方后，可拉取该账号下可用的模型列表。'}</div>
    </div>`;

  const ttsExtra = r.id === 'tts' ? `
    <div class="ms-field">
      <div class="ms-label">音色</div>
      <select class="ms-select" onchange="setRoleOption('tts','voice',this.value)">
        ${['male-qn-qingse','female-shaonv','presenter_male','alloy','nova'].map(v=>
          `<option value="${v}" ${s.options.voice===v?'selected':''}>${v}</option>`).join('')}
      </select>
    </div>
    <div class="ms-field">
      <div class="ms-row"><span class="ms-label" style="margin:0;white-space:nowrap">语速</span>
        <input type="range" min="0.5" max="2" step="0.1" value="${s.options.speed||1}" style="flex:1"
          oninput="setRoleOption('tts','speed',this.value);this.nextElementSibling.textContent=this.value">
        <span style="font-size:13px;width:34px;text-align:right">${s.options.speed||1}</span>
      </div>
    </div>` : '';

  const embExtra = r.id === 'embedding' ? `
    <div class="ms-field">
      <div class="ms-label">向量维度</div>
      <input class="ms-input" value="${s.options.dimension||''}" placeholder="如 1536" oninput="setRoleOption('embedding','dimension',this.value)">
    </div>` : '';

  return `<section class="ms-main">
    <div class="head">
      <div class="ic ${r.color}">${icon(r.icon,20)}</div>
      <div><h3>${r.name}</h3><div class="sub">${r.desc}</div></div>
      <span class="ms-badge ${stCls}">${stText}</span>
    </div>
    ${!r.wired ? `<div class="ms-hint" style="margin-top:14px;background:#f7f8f6;border-radius:12px;padding:10px 12px">
      该角色暂未接入业务，配置会保存，但不会影响现有功能。
    </div>` : ''}
    ${r.id==='task' ? `
      <div class="ms-field">
        <label style="display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;cursor:pointer">
          <input type="checkbox" ${s.mode==='inherit'?'checked':''} onchange="toggleTaskInherit(this.checked)">
          跟随语言模型（推荐）
        </label>
        <div class="ms-hint">开启后后台任务沿用语言模型的配置；只有在想用更便宜 / 更快的模型时才需要单独配置。</div>
      </div>` : ''}
    ${inherit ? '' : `
      <div class="ms-field">
        <div class="ms-label">提供方</div>
        <select class="ms-select" onchange="setRoleConn('${r.id}', this.value)">${connOptions}</select>
        ${!conn ? `<div class="ms-hint">先到「提供方」里添加一套凭证，再回到这里选择。</div>` : ''}
      </div>
      ${modelField}
      ${ttsExtra}
      ${embExtra}
    `}
    <div class="ms-actions">
      ${r.id==='tts' ? `<button class="btn-ghost" style="padding:10px 20px" onclick="testVoice()">试听语音</button>` : ''}
      <button class="btn-ghost" style="padding:10px 20px" onclick="probeRole('${r.id}')">测试连接</button>
      <button class="btn-primary" style="padding:10px 24px" onclick="saveModelServices()">保存配置</button>
    </div>
    <div style="margin-top:22px;padding-top:18px;border-top:1px solid #eef1ec">
      <div style="font-size:12px;font-weight:700;color:var(--gray2);letter-spacing:.04em;margin-bottom:4px">当前生效配置</div>
      ${summaryRows}
    </div>
  </section>`;
}

function renderModelServices(){
  const isConn = modelRoleTab === 'connections';
  return `<div class="ms-wrap">
    ${renderMsNav()}
    ${isConn ? renderMsConnections() : renderMsRole()}
  </div>`;
}
function selectModelRole(id){ modelRoleTab = id; connEditing = null; render(); }
function setRoleConn(role, connId){
  modelServices[role].connectionId = connId || null;
  const list = msModelsFor(connId);
  if(connId && !list.includes(modelServices[role].model)) modelServices[role].model = list[0] || '';
  if(!connId) modelServices[role].model = '';
  render();
}
function setRoleModel(role, model){ modelServices[role].model = model; }
function setRoleOption(role, key, val){
  modelServices[role].options = modelServices[role].options || {};
  modelServices[role].options[key] = val;
}
function toggleTaskInherit(on){ modelServices.task.mode = on ? 'inherit' : 'reference'; render(); }
function toggleConnEdit(id){ connEditing = connEditing === id ? null : id; render(); }
function connField(id, field, val){
  const c = msConn(id); if(!c) return;
  if(field === 'newKey') c._newKey = val; else c[field] = val;
}
function addConn(){
  const id = 'c' + (MODEL_CONNECTIONS.length + 1 + Math.floor(Math.random()*1000));
  MODEL_CONNECTIONS.push({id, provider:'openai', name:'新提供方', baseUrl:'', key:'', models:['gpt-4o','gpt-4o-mini']});
  connEditing = id; modelRoleTab = 'connections'; render();
}
function removeConn(id){
  const i = MODEL_CONNECTIONS.findIndex(c=>c.id===id);
  if(i < 0) return;
  MODEL_CONNECTIONS.splice(i, 1);
  // 引用该连接的档位降级为未配置，不级联删除角色配置
  Object.keys(modelServices).forEach(role=>{
    if(modelServices[role].connectionId === id){ modelServices[role].connectionId = null; modelServices[role].model = ''; }
  });
  if(connEditing === id) connEditing = null;
  render(); toast('已删除提供方');
}
function probeRole(role){
  const s = modelServices[role];
  if(!s.connectionId){ probeState[role] = {msg:'请先选择提供方。'}; render(); return; }
  probeState[role] = {msg:'正在测试连接…'};
  render();
  setTimeout(()=>{
    const c = msConn(s.connectionId);
    probeState[role] = {msg: c ? `连接成功 · 可用模型 ${c.models.length} 个` : '连接失败：提供方不存在'};
    render();
  }, 700);
}
function saveModelServices(){
  MODEL_CONNECTIONS.forEach(c=>{ if(c._newKey){ c.key = '••••••••' + c._newKey.slice(-4); delete c._newKey; } });
  toast('模型与服务配置已保存（原型演示）');
  render();
}
function testVoice(){ if(window.speechSynthesis){ const u=new SpeechSynthesisUtterance('你好，这是语音合成测试'); u.lang='zh-CN'; speechSynthesis.cancel(); speechSynthesis.speak(u); toast('已播放试听语音'); } else toast('浏览器不支持语音合成'); }

// ===== 占位页 =====
const PLACEHOLDER = {
  '学习中心':{icon:'book',title:'学习中心',desc:'听写、听力、阅读理解等专项练习将在这里展开。'},
  '学习报告':{icon:'chart',title:'学习报告',desc:'学习时长、掌握度、错误频率统计将在这里呈现。'},
  '积分商城':{icon:'gift',title:'积分商城',desc:'积分兑换平板 / 手机使用时间，将在这里完成。'}
};
function renderPlaceholder(name){
  const p = PLACEHOLDER[name];
  return `
  <header class="page-head">
    <div><h1>${name}</h1></div>
  </header>
  <div class="placeholder-page">
    <div class="ic">${icon(p.icon,32)}</div>
    <h2>${p.title}</h2>
    <p>${p.desc}</p>
    <p style="margin-top:12px;font-size:12px;color:#a0a7a2">（此页面在 Figma 原型中尚未完整设计，本地原型先以占位呈现）</p>
  </div>`;
}

// 初始化
renderNav();
render();
</script>
</body>
