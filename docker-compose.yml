# ============================================
# KnoAct（知学伴）docker-compose 部署
# ============================================
# 基础服务（默认启动）：
#   mysql       MySQL 8.4，数据挂卷持久化，仅容器网络内可访问（不映射宿主端口）
#   backend     FastAPI 后端，连 mysql；上传文件挂卷持久化
#   frontend    旧版学生端 Web（冻结，Flutter 学生端完成后移除）
#   parent-web  家长端
#   admin-web   运营后台（用户管理）
#   student-app Flutter 学生端（Web），功能对齐后替代 frontend
#   三个前端均由 nginx 托管静态页，并把 /api、/uploads 反代到 backend（同源，无跨域）
# 动画渲染（可选，profile=render，镜像较大）：
#   render          render_service，manim 动画 + TTS 旁白合轨
#   sandbox-runner  执行 LLM 生成的 manim 代码的隔离容器（无外网、非 root、只读根 FS）
#
# 用法：
#   cp .env.example .env                        # 必须改 MySQL 密码，按需修改端口等
#   docker compose up -d --build                # 只起基础服务
#   docker compose up -d --build backend        # 仅重建后端（改 API 时常用，避免连编全部前端）
#   编 student-app 前建议 df -h 根分区剩余 ≥15GB；不足时 sh scripts/docker-free-disk.sh
#   （只清悬空镜像/过期构建缓存，保留 MySQL 卷和正在用的 pip/Flutter 层；勿改成 prune -af）
#   docker compose --profile render up -d --build   # 连同动画渲染一起起
# 构建/拉取加速：统一在 .env 配置（默认官方源）；Hub 可多镜像 → scripts/docker-registry-mirrors.sh
# 首次：docker compose pull && docker compose up -d --build   日常：只 build 改动的服务
# 访问：学生端（Flutter）http://<服务器IP>:${KNOACT_STUDENT_PORT:-8082}，旧版学生端 :${KNOACT_HTTP_PORT:-8080}，家长端 :${KNOACT_PARENT_PORT:-8081}
# ============================================

name: knoact

# 密码含 @ : / ? # % 等字符时需 URL 编码，否则连接串解析出错
x-db-url: &db-url mysql+pymysql://${MYSQL_USER:-knoact}:${MYSQL_PASSWORD:?请在 .env 设置 MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-zhixueban}?charset=utf8mb4

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhixueban}
      MYSQL_USER: ${MYSQL_USER:-knoact}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 设置 MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - knoact-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple/}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-pypi.org}
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
    image: knoact-backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: *db-url
      KNOACT_RENDER_SERVICE_URL: http://render:8011
      TZ: ${TZ:-Asia/Shanghai}
      # 生产务必在 .env 设置强 JWT_SECRET 与 ADMIN_INITIAL_PASSWORD（勿提交 .env）
      JWT_SECRET: ${JWT_SECRET:-dev-change-me}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-ChangeMe123}
    volumes:
      - knoact-uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build: ./frontend
    image: knoact-frontend:latest
    restart: unless-stopped
    ports:
      - "${KNOACT_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  parent-web:
    build: ./parent-web
    image: knoact-parent-web:latest
    restart: unless-stopped
    ports:
      - "${KNOACT_PARENT_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy

  admin-web:
    build: ./admin-web
    image: knoact-admin-web:latest
    restart: unless-stopped
    ports:
      - "${KNOACT_ADMIN_PORT:-8768}:80"
    depends_on:
      backend:
        condition: service_healthy

  student-app:
    build:
      context: ./student-app
      args:
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
        PUB_HOSTED_URL: ${PUB_HOSTED_URL:-https://pub.dev}
        FLUTTER_STORAGE_BASE_URL: ${FLUTTER_STORAGE_BASE_URL:-https://storage.googleapis.com}
        PUB_FALLBACK_URL: ${PUB_FALLBACK_URL:-https://pub.dev}
        FLUTTER_FALLBACK_STORAGE: ${FLUTTER_FALLBACK_STORAGE:-https://storage.googleapis.com}
    image: knoact-student-app:latest
    restart: unless-stopped
    ports:
      - "${KNOACT_STUDENT_PORT:-8082}:80"
    depends_on:
      backend:
        condition: service_healthy

  render:
    profiles: ["render"]
    build:
      context: .
      dockerfile: render_service/Dockerfile
    image: knoact-render:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: *db-url
      KNOACT_RENDER_SANDBOX: docker
      KNOACT_RENDER_RUNNER_URL: http://sandbox-runner:8901
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - render-media:/app/render_service/media
    networks:
      - default
      - render-net
    depends_on:
      backend:
        condition: service_healthy
      sandbox-runner:
        condition: service_healthy

  sandbox-runner:
    profiles: ["render"]
    build:
      context: .
      dockerfile: render_service/runner/Dockerfile
    image: knoact-render-runner:latest
    restart: unless-stopped
    environment:
      RUNNER_PORT: "8901"
    volumes:
      - render-media:/outputs
    networks:
      - render-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /home/runner
    pids_limit: 256
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8901/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
  # internal：runner 只能与 render 通信，无法访问外网
  render-net:
    internal: true

volumes:
  knoact-mysql:
  knoact-uploads:
  render-media:
