<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知学伴 · AI 学习伙伴</title>
<style>
  :root{
    --blue:#3158e8; --blue2:#4566e8; --blue3:#3d66f5; --blue4:#5574e9; --blue5:#5b77eb;
    --blue-soft:#edf1ff; --blue-soft2:#f5f7ff; --blue-soft3:#f1f4ff; --blue-border:#8ea2ef;
    --green:#2e8b5a; --green2:#2e9b62; --green-soft:#e8f7ef; --green-soft2:#eaf7ef;
    --orange:#dc872d; --orange2:#c97629; --orange3:#d57f2c; --orange-soft:#fff2df; --orange-soft2:#fff1df;
    --gold:#ffc45c; --gold2:#ffad27; --gold3:#f59d20;
    --purple:#7457d7; --purple-soft:#f0edff;
    --bg:#f7f8f5; --card:#fff;
    --ink:#202723; --ink2:#354038; --ink3:#4b544e;
    --gray:#78817b; --gray2:#8a928d; --gray3:#9aa19c; --gray4:#a0a7a2;
    --line:#e3e7e0; --line2:#e2e6e0; --line3:#e1e5df;
    --dark-card:#202c28;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  button{cursor:pointer;font-family:inherit;border:none;background:none}
  .serif{font-family:Georgia,"Songti SC","SimSun",serif}

  /* 布局 */
  .layout{display:flex;min-height:100vh}
  .sidebar{position:fixed;inset-y:0;left:0;width:232px;background:var(--card);border-right:1px solid var(--line);padding:28px 20px;display:flex;flex-direction:column;z-index:20}
  .main{flex:1;margin-left:232px;padding:24px 40px 56px;max-width:1440px}

  /* 侧边栏 */
  .logo{display:flex;align-items:center;gap:12px;padding:0 8px}
  .logo-badge{width:40px;height:40px;border-radius:12px;background:var(--blue3);color:#fff;display:grid;place-items:center}
  .logo-name{font-size:18px;font-weight:700;letter-spacing:-.02em}
  .logo-sub{font-size:11px;color:#8a938d}
  .nav{margin-top:40px;display:flex;flex-direction:column;gap:8px}
  .nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:500;color:#69716c;transition:.15s;text-align:left}
  .nav-item:hover{background:#f4f5f3}
  .nav-item.active{background:var(--blue-soft);color:var(--blue)}
  .nav-item svg{flex-shrink:0}
  .ai-tip{margin-top:auto;border-radius:16px;background:var(--blue-soft3);padding:16px}
  .ai-tip-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--blue);margin-bottom:8px}
  .ai-tip p{font-size:12px;line-height:20px;color:#626d7e}
  .user-row{margin-top:20px;display:flex;align-items:center;gap:12px;border-top:1px solid #edf0ec;padding:20px 8px 0}
  .avatar{width:36px;height:36px;border-radius:50%;background:#ffe5c7;color:#a85a23;display:grid;place-items:center;font-weight:700;font-size:14px}
  .user-name{font-size:14px;font-weight:600}
  .user-grade{font-size:12px;color:var(--gray3)}

  /* 顶部 header */
  .page-head{display:flex;align-items:center;justify-content:space-between}
  .page-head .date{font-size:14px;color:var(--gray)}
  .page-head h1{margin-top:4px;font-size:30px;font-weight:700;letter-spacing:-.025em}
  .head-right{display:flex;align-items:center;gap:12px}
  .points-pill{display:flex;align-items:center;gap:8px;border:1px solid #e2e5e1;background:var(--card);padding:8px 16px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .points-pill .star{color:var(--gold2)}

  /* 通用 */
  .section-title{display:flex;align-items:flex-end;justify-content:space-between}
  .section-title h2{font-size:20px;font-weight:700}
  .section-title .sub{margin-top:4px;font-size:14px;color:var(--gray2)}
  .badge-blue{background:var(--blue-soft);color:var(--blue2)}
  .badge-green{background:var(--green-soft);color:var(--green)}
  .badge-orange{background:var(--orange-soft);color:var(--orange2)}

  /* Hero 卡片 */
  .hero-grid{display:grid;grid-template-columns:1.55fr .75fr;gap:20px;margin-top:28px}
  .hero{position:relative;overflow:hidden;border-radius:26px;background:var(--blue);color:#fff;padding:32px 36px;box-shadow:0 14px 35px rgba(49,88,232,.18)}
  .hero .tag{display:inline-flex;align-items:center;gap:8px;border-radius:999px;background:rgba(255,255,255,.15);padding:6px 12px;font-size:12px;font-weight:500;margin-bottom:16px}
  .hero h2{font-size:28px;font-weight:700;line-height:1.35;max-width:520px}
  .hero p{margin-top:8px;font-size:14px;line-height:24px;color:#c4d0ff;max-width:520px}
  .hero .start-btn{margin-top:24px;display:inline-flex;align-items:center;gap:8px;border-radius:12px;background:#fff;color:var(--blue);padding:12px 20px;font-size:14px;font-weight:700;transition:.15s}
  .hero .start-btn:hover{transform:translateY(-2px)}
  .hero .deco-ring{position:absolute;bottom:-96px;right:-48px;width:288px;height:288px;border-radius:50%;border:44px solid rgba(255,255,255,.1)}
  .hero .deco-glow{position:absolute;right:80px;top:32px;width:96px;height:96px;border-radius:50%;background:rgba(102,130,240,.6);filter:blur(24px)}
  .hero .deco-icon{position:absolute;bottom:28px;right:40px;transform:rotate(6deg);border-radius:16px;background:rgba(255,255,255,.1);padding:20px;backdrop-filter:blur(4px);display:none}

  .weekly-card{border-radius:26px;border:1px solid var(--line);background:var(--card);padding:24px}
  .weekly-card .head{display:flex;justify-content:space-between;align-items:center}
  .weekly-card .head h2{font-weight:700;font-size:16px}
  .weekly-card .head span{font-size:12px;color:var(--gray2)}
  .bars{margin-top:28px;display:flex;align-items:flex-end;justify-content:space-between}
  .bar{display:flex;flex-direction:column;align-items:center;gap:8px}
  .bar .track{position:relative;height:96px;width:20px;border-radius:999px;background:#eef0ed;display:flex;align-items:flex-end;overflow:hidden}
  .bar .fill{width:100%;border-radius:999px}
  .bar span{font-size:11px;color:var(--gray3)}
  .bar.today span{font-weight:700;color:var(--blue)}
  .streak{margin-top:20px;display:flex;align-items:center;gap:8px;border-radius:12px;background:#fff7e9;padding:10px 12px;font-size:12px;color:#8d652a}

  /* 任务 */
  .tasks-section{margin-top:36px}
  .task-info{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:24px;border:1px solid #dfe4f5;background:var(--blue-soft2);padding:16px 20px;border-radius:16px}
  .task-info .lead{display:flex;align-items:center;gap:12px}
  .task-info .lead .ic{width:36px;height:36px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center}
  .task-info .lead .t1{font-size:14px;font-weight:700}
  .task-info .lead .t2{font-size:12px;color:#7d879d}
  .divider{width:1px;height:32px;background:#dce1ef}
  .composition{flex:1;min-width:280px;display:flex;align-items:center;gap:12px}
  .composition .lbl{font-size:12px;font-weight:600;color:#5e687c;white-space:nowrap}
  .comp-bar{flex:1;height:8px;border-radius:999px;background:#e0e4ee;display:flex;overflow:hidden}
  .comp-bar .seg1{width:70%;background:var(--blue4)}
  .comp-bar .seg2{width:30%;background:#54aa78}
  .comp-legend{font-size:12px;color:#69748a;white-space:nowrap}
  .comp-legend b{color:var(--blue2)}
  .comp-legend b.g{color:#329260}
  .due-pill{display:flex;align-items:center;gap:8px;border-radius:999px;background:#fff;padding:8px 12px;font-size:12px;color:#5e687c}

  .task-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
  .task-card{border:1px solid var(--line2);background:var(--card);border-radius:16px;padding:20px;transition:.15s}
  .task-card:hover{transform:translateY(-2px);box-shadow:0 10px 15px -3px rgba(0,0,0,.1)}
  .task-card .top{display:flex;align-items:flex-start;gap:16px}
  .task-ic{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex-shrink:0}
  .task-ic.blue{background:var(--blue-soft);color:var(--blue2)}
  .task-ic.orange{background:var(--orange-soft);color:var(--orange)}
  .task-ic.green{background:var(--green-soft);color:var(--green2)}
  .task-card .t-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .task-tag{font-size:10px;font-weight:700;border-radius:999px;padding:4px 8px}
  .task-card h3{font-size:15px;font-weight:700}
  .task-card .detail{margin-top:4px;font-size:14px;color:#7e8781}
  .task-card .foot{margin-top:16px;display:flex;justify-content:space-between;align-items:center}
  .task-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray3)}
  .task-points{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#dc8b22}
  .task-btn{margin-top:20px;width:100%;border-radius:12px;padding:10px;font-size:14px;font-weight:600;text-align:center;transition:.15s}
  .task-btn.todo{background:#f2f4f1;color:#4b544e}
  .task-btn.todo:hover{background:var(--blue);color:#fff}
  .task-btn.done{background:var(--green-soft2);color:var(--green)}

  /* 智能复习 + 积分兑换 */
  .review-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;margin-top:36px}
  .review-card{border:1px solid var(--line2);background:var(--card);border-radius:24px;padding:24px}
  .review-card .head{display:flex;justify-content:space-between;align-items:center}
  .review-card .head h2{font-size:18px;font-weight:700}
  .review-card .head .sub{margin-top:4px;font-size:14px;color:var(--gray2)}
  .head-ic{width:40px;height:40px;border-radius:12px;background:var(--purple-soft);color:var(--purple);display:grid;place-items:center}
  .review-items{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .review-item{display:flex;align-items:center;gap:16px;border:1px solid #e7e9e6;border-radius:16px;padding:16px;text-align:left;transition:.15s}
  .review-item:hover{border-color:var(--blue-border)}
  .review-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;font-weight:700;flex-shrink:0}
  .review-ic.yw{background:var(--blue-soft);color:var(--blue2)}
  .review-ic.en{background:var(--orange-soft2);color:var(--orange3)}
  .review-item .name{font-size:14px;font-weight:700}
  .review-item .cnt{margin-top:4px;font-size:12px;color:#8e9691}

  .redeem-card{border-radius:24px;background:var(--dark-card);color:#fff;padding:24px}
  .redeem-card .head{display:flex;justify-content:space-between;align-items:flex-start}
  .redeem-card .lbl{font-size:12px;font-weight:500;color:#9daba5}
  .redeem-card h2{margin-top:4px;font-size:18px;font-weight:700}
  .redeem-card .pts{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:700;color:var(--gold)}
  .redeem-items{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .redeem-item{border-radius:16px;background:rgba(255,255,255,.1);padding:16px;text-align:left;transition:.15s}
  .redeem-item:hover{background:rgba(255,255,255,.15)}
  .redeem-item .name{margin-top:16px;font-size:14px;font-weight:700}
  .redeem-item .cost{margin-top:4px;font-size:12px;color:var(--gold)}

  /* 页头面包屑（子页通用） */
  .crumb{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--blue)}
  .page-head h1.big{margin-top:8px;font-size:30px;font-weight:700;letter-spacing:-.025em}
  .page-head .desc{margin-top:8px;font-size:14px;color:var(--gray)}

  /* 个性化学习 */
  .pl-grid{display:grid;grid-template-columns:1.55fr .8fr;gap:20px;margin-top:28px;min-height:680px}
  .pl-reader{border:1px solid var(--line3);background:var(--card);border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
  .pl-reader .bar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e7eae6;padding:16px 20px}
  .pl-reader .bar .t{display:flex;align-items:center;gap:12px;min-width:0}
  .pl-reader .bar .ic{width:36px;height:36px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex-shrink:0}
  .pl-reader .bar .name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl-reader .bar .sub{font-size:12px;color:#929a94}
  .reader-body{flex:1;background:#f5f2ea;display:flex;justify-content:center;padding:24px;overflow:auto}
  .reader-page{width:100%;max-width:620px;min-height:760px;background:#fff;padding:48px 64px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .reader-page .unit{text-align:center;font-size:12px;font-weight:600;letter-spacing:.3em;color:#83918a}
  .reader-page h2{margin-top:16px;text-align:center;font-size:30px;font-weight:700}
  .reader-page .body{margin-top:24px;font-size:15px;line-height:30px;color:var(--ink2)}
  .pl-side{display:flex;flex-direction:column;gap:20px}
  .pl-ask{border:1px solid var(--line3);background:var(--card);border-radius:24px;padding:20px}
  .pl-ask h3{font-size:16px;font-weight:700}
  .pl-ask .ta{margin-top:12px;width:100%;min-height:110px;border:1px solid var(--line3);border-radius:12px;padding:12px;font-size:13px;font-family:inherit;resize:vertical;color:var(--ink)}
  .pl-ask .ta:focus{outline:none;border-color:var(--blue-border)}
  .quick-actions{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
  .qa-btn{border:1px solid var(--line3);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--ink3);transition:.15s}
  .qa-btn:hover{border-color:var(--blue-border);color:var(--blue)}
  .pl-question{border:1px solid var(--line3);background:var(--card);border-radius:24px;padding:20px}
  .pl-question h3{font-size:16px;font-weight:700}
  .pl-question .qa-input{margin-top:12px;display:flex;gap:8px}
  .pl-question input{flex:1;border:1px solid var(--line3);border-radius:12px;padding:10px 12px;font-size:13px;font-family:inherit}
  .pl-question input:focus{outline:none;border-color:var(--blue-border)}
  .send-btn{border-radius:12px;background:var(--blue);color:#fff;padding:0 20px;font-size:14px;font-weight:600}
  .pl-answer{border:1px solid var(--line3);background:#fafbf9;border-radius:24px;padding:20px}
  .pl-answer h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
  .pl-answer .ans{margin-top:12px;font-size:13px;line-height:22px;color:var(--ink3)}

  /* 教材列表 */
  .materials{margin-top:28px;border:1px solid var(--line3);background:var(--card);border-radius:24px;padding:20px}
  .materials .head{display:flex;justify-content:space-between;align-items:center}
  .materials .head h2{font-size:16px;font-weight:700}
  .materials .head .sub{margin-top:4px;font-size:12px;color:#8e9691}
  .add-book{display:inline-flex;align-items:center;gap:8px;border:1px solid #dfe3de;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;color:#4f5952;transition:.15s}
  .add-book:hover{border-color:var(--blue-border);color:var(--blue)}
  .book-list{margin-top:16px;display:flex;gap:12px;overflow-x:auto;padding-bottom:4px}
  .book-card{min-width:210px;display:flex;align-items:center;gap:12px;border:1px solid #e4e7e3;border-radius:16px;padding:12px;text-align:left;transition:.15s}
  .book-card.active{border-color:#6f88ed;background:var(--blue-soft2);box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .book-spine{width:44px;height:56px;border-radius:8px;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
  .book-spine.blue{background:var(--blue4)}
  .book-spine.orange{background:#ed9848}
  .book-spine.green{background:#45a879}
  .book-card .nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .book-card .tp{margin-top:4px;font-size:12px;color:#929a94}

  /* 错题本 */
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
  .stat-card{border:1px solid var(--line3);background:var(--card);border-radius:16px;padding:20px}
  .stat-card .t{font-size:14px;color:#7e8781}
  .stat-card .row{margin-top:8px;display:flex;align-items:flex-end;justify-content:space-between}
  .stat-card .v{font-size:24px;font-weight:700}
  .stat-card .d{border-radius:999px;padding:4px 10px;font-size:12px}
  .wrong-list{margin-top:24px;border:1px solid var(--line3);background:var(--card);border-radius:24px;padding:24px}
  .wrong-list .head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
  .wrong-list .head h2{font-size:18px;font-weight:700}
  .wrong-list .head .sub{margin-top:4px;font-size:12px;color:#8e9691}
  .filter{display:flex;border-radius:12px;background:#f2f4f1;padding:4px}
  .filter button{border-radius:10px;padding:8px 16px;font-size:12px;font-weight:600;color:#778079}
  .filter button.active{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .wrong-items{margin-top:20px;display:flex;flex-direction:column;gap:16px}
  .wrong-card{border:1px solid var(--line);border-radius:16px;padding:20px}
  .wrong-card .top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
  .wrong-card .meta{display:flex;align-items:center;gap:8px}
  .wrong-card .subj-tag{border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700}
  .wrong-card .src{font-size:12px;color:#808983}
  .wrong-card .date{font-size:12px;color:var(--gray4)}
  .wrong-card .q{margin-top:16px;font-size:15px;font-weight:600;line-height:28px}
  .wrong-ans{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .wa{border-radius:12px;padding:12px 16px}
  .wa.bad{background:#fff3f0}
  .wa.good{background:#eef8f2}
  .wa .lbl{font-size:11px;font-weight:700}
  .wa.bad .lbl{color:#b65f52}
  .wa.good .lbl{color:#39815a}
  .wa .val{margin-top:4px;font-size:14px}
  .wa.bad .val{color:#704a44}
  .wa.good .val{color:#3d5e4b}
  .wrong-card .foot{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
  .wrong-card .reason{display:flex;align-items:center;gap:8px;font-size:12px;color:#747e77}
  .wrong-card .reason b{font-weight:700}
  .wrong-card .actions{display:flex;gap:8px}
  .btn-ghost{border:1px solid #dfe3de;border-radius:12px;padding:8px 16px;font-size:12px;font-weight:600;color:#59625c}
  .btn-ghost:hover{background:#f5f6f4}
  .btn-primary{border-radius:12px;background:var(--blue);color:#fff;padding:8px 16px;font-size:12px;font-weight:600}

  /* 提示 toast */
  .toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:50;border-radius:999px;background:var(--dark-card);color:#fff;padding:12px 20px;font-size:14px;font-weight:600;box-shadow:0 20px 25px -5px rgba(0,0,0,.2);display:none}

  /* 学习中心 / 学习报告 / 积分商城 占位补充页 */
  .placeholder-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;color:var(--gray)}
  .placeholder-page .ic{width:72px;height:72px;border-radius:24px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;margin-bottom:20px}
  .placeholder-page h2{font-size:22px;font-weight:700;color:var(--ink)}
  .placeholder-page p{margin-top:8px;font-size:14px}

  /* 学习中心 */
  .center-tabs{display:flex;gap:10px;margin:20px 0 24px;flex-wrap:wrap}
  .center-tab{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line3);background:var(--card);border-radius:12px;padding:10px 18px;font-size:14px;font-weight:600;color:#4f5952;cursor:pointer;transition:.15s}
  .center-tab:hover{border-color:var(--blue-border);color:var(--blue)}
  .center-tab.active{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
  .center-tab.dict{border-color:var(--orange);color:var(--orange)}
  .center-panel{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
  .center-material{border:1px solid var(--line3);background:var(--card);border-radius:20px;padding:24px}
  .cm-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--blue);margin-bottom:16px}
  .cm-text{font-size:15px;line-height:28px;color:var(--ink);white-space:pre-wrap}
  .center-play{margin-top:16px;display:inline-flex;align-items:center;gap:8px;border-radius:12px;background:var(--blue);color:#fff;padding:10px 20px;font-size:14px;font-weight:700}
  .cm-hint{margin-top:12px;font-size:13px;color:var(--muted)}
  .center-questions{display:flex;flex-direction:column;gap:16px}
  .center-question{border:1px solid var(--line3);background:var(--card);border-radius:16px;padding:20px}
  .cq-q{font-size:14px;font-weight:600;color:var(--ink);line-height:22px}
  .cq-form{display:flex;gap:10px;margin-top:14px}
  .cq-input{flex:1;border:1px solid var(--line3);border-radius:10px;padding:10px 14px;font-size:14px;font-family:inherit}
  .cq-input:focus{outline:none;border-color:var(--blue3)}
  .cq-btn{border-radius:10px;background:var(--blue);color:#fff;padding:10px 18px;font-size:14px;font-weight:600}
  .cq-ans{margin-top:14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
  .cq-ans.right{color:var(--green)}
  .cq-ans.wrong{color:#c04b3a}
  .center-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:40vh;text-align:center;color:var(--gray)}
  .center-empty p{margin-top:12px;font-size:14px}
  @media (max-width:820px){ .center-panel{grid-template-columns:1fr} }

  /* 听写练习 */
  .dict-wrap{max-width:720px;margin:0 auto}
  .dict-progress{margin-top:28px;display:flex;align-items:center;gap:16px}
  .dict-progress .pbar{flex:1;height:8px;border-radius:999px;background:#e7eae6;overflow:hidden}
  .dict-progress .pfill{height:100%;background:var(--blue);transition:width .25s}
  .dict-progress .ptxt{font-size:13px;color:var(--gray2);white-space:nowrap}
  .dict-card{margin-top:24px;border:1px solid var(--line3);background:var(--card);border-radius:24px;padding:40px 32px;text-align:center}
  .dict-word-ic{width:88px;height:88px;margin:0 auto;border-radius:24px;background:var(--blue-soft);color:var(--blue2);display:grid;place-items:center}
  .dict-hint{margin-top:16px;font-size:14px;color:var(--gray2)}
  .dict-play{margin-top:24px;display:inline-flex;align-items:center;gap:8px;border-radius:12px;background:var(--blue);color:#fff;padding:12px 24px;font-size:15px;font-weight:700}
  .dict-play.playing{background:var(--blue2)}
  .dict-input{margin-top:24px;width:100%;max-width:360px;border:1px solid var(--line3);border-radius:14px;padding:14px 18px;font-size:16px;font-family:inherit;text-align:center;letter-spacing:.08em}
  .dict-input:focus{outline:none;border-color:var(--blue3);box-shadow:0 0 0 3px rgba(49,88,232,.12)}
  .dict-enter{margin-top:16px;border-radius:12px;background:var(--green);color:#fff;padding:12px 32px;font-size:15px;font-weight:700}
  .dict-enter:disabled{opacity:.5;cursor:default}
  .dict-feedback{margin-top:24px;border-radius:16px;padding:20px 24px;text-align:left;display:none}
  .dict-feedback.right{display:block;background:var(--green-soft2);color:#3d5e4b}
  .dict-feedback.wrong{display:block;background:#fff3f0;color:#704a44}
  .dict-feedback .fb-head{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
  .dict-feedback .fb-body{margin-top:8px;font-size:14px;line-height:24px}
  .dict-next{margin-top:16px;border-radius:12px;background:var(--blue);color:#fff;padding:12px 28px;font-size:15px;font-weight:700}
  .dict-done{margin-top:24px;border:1px solid var(--line3);background:var(--card);border-radius:24px;padding:40px 32px;text-align:center}
  .dict-done .big{font-size:22px;font-weight:700}
  .dict-done .sub{margin-top:8px;font-size:14px;color:var(--gray2)}
  .dict-done .stat{margin-top:24px;display:flex;justify-content:center;gap:40px}
  .dict-done .stat .k{font-size:13px;color:var(--gray2)}
  .dict-done .stat .v{font-size:28px;font-weight:700;margin-top:4px}
  .dict-done .stat .v.g{color:var(--green)}
  .dict-done .stat .v.r{color:#b65f52}

  /* 家长端 */
  .parent-banner{border:1px solid #f0d9b8;background:#fff8ec;border-radius:16px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;margin-top:28px}
  .parent-banner .l{display:flex;align-items:center;gap:12px}
  .parent-banner .l .ic{width:40px;height:40px;border-radius:12px;background:#ffe5c7;color:#a85a23;display:grid;place-items:center}
  .parent-banner .l .t{font-size:14px;font-weight:700;color:#6d4b1e}
  .parent-banner .l .s{margin-top:2px;font-size:12px;color:#a08a5f}
  .switch-role{display:inline-flex;align-items:center;gap:8px;border-radius:12px;background:var(--orange);color:#fff;padding:10px 18px;font-size:14px;font-weight:700}
  .parent-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}
  .parent-panel{border:1px solid var(--line3);background:var(--card);border-radius:24px;padding:24px}
  .parent-panel .head{display:flex;align-items:center;gap:12px}
  .parent-panel .head .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
  .parent-panel .head .ic.blue{background:var(--blue-soft);color:var(--blue2)}
  .parent-panel .head .ic.green{background:var(--green-soft);color:var(--green2)}
  .parent-panel .head .ic.purple{background:var(--purple-soft);color:var(--purple)}
  .parent-panel .head .ic.orange{background:var(--orange-soft);color:var(--orange2)}
  .parent-panel .head h3{font-size:16px;font-weight:700}
  .parent-panel .head .sub{margin-top:2px;font-size:12px;color:#8e9691}
  .parent-panel .bd{margin-top:16px}
  .lesson-steps{display:flex;flex-direction:column;gap:8px}
  .lesson-step{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink3)}
  .lesson-step .dot{width:8px;height:8px;border-radius:50%;background:var(--blue4)}
  .lesson-step .lnk{margin-left:auto;font-size:12px;color:var(--blue2);font-weight:600;cursor:pointer}
  .kw-chip-row{display:flex;flex-wrap:wrap;gap:8px}
  .kw-chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--blue-soft);color:var(--blue2);padding:6px 12px;font-size:12px;font-weight:600}
  .kw-chip .del{cursor:pointer;opacity:.6}
  .kw-chip-add{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--blue-border);border-radius:999px;color:var(--blue2);padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer}
  .goal-list{display:flex;flex-direction:column;gap:12px}
  .goal-item{border:1px solid #e7e9e6;border-radius:14px;padding:14px 16px}
  .goal-item .g-top{display:flex;align-items:center;justify-content:space-between}
  .goal-item .g-name{font-size:14px;font-weight:700}
  .goal-item .g-status{font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px}
  .goal-item .g-bar{margin-top:10px;height:6px;border-radius:999px;background:#eef0ed;overflow:hidden}
  .goal-item .g-fill{height:100%;border-radius:999px}
  .goal-item .g-meta{margin-top:8px;font-size:12px;color:#8e9691}
  .weak-list{display:flex;flex-direction:column;gap:12px}
  .weak-row{display:flex;align-items:center;gap:12px}
  .weak-row .w-name{width:80px;font-size:13px;color:var(--ink3);flex-shrink:0}
  .weak-row .w-bar{flex:1;height:10px;border-radius:999px;background:#eef0ed;overflow:hidden}
  .weak-row .w-fill{height:100%;border-radius:999px;background:var(--orange)}
  .weak-row .w-val{width:56px;text-align:right;font-size:13px;font-weight:700;color:var(--orange2)}
  .redeem-rule{display:flex;flex-direction:column;gap:12px}
  .rule-row{display:flex;align-items:center;justify-content:space-between;border:1px solid #e7e9e6;border-radius:14px;padding:14px 16px}

  .rule-row .r-name{font-size:14px;font-weight:700}
  .rule-row .r-cost{margin-top:2px;font-size:12px;color:#8e9691}

  /* PDF 拆课 */

  .pdf-row .st.processing{color:var(--orange2)}
  .pdf-row .st.done{color:var(--green)}
  .upload-drop{margin-top:16px;border:2px dashed var(--blue-border);border-radius:16px;padding:40px 24px;text-align:center;cursor:pointer;transition:.15s}
  .upload-drop:hover{border-color:var(--blue3);background:var(--blue-soft2)}
  .upload-drop .ic{width:56px;height:56px;margin:0 auto;border-radius:16px;background:var(--blue-soft);color:var(--blue2);display:grid;place-items:center}
  .upload-drop .t{margin-top:12px;font-size:15px;font-weight:700}
  .upload-drop .s{margin-top:4px;font-size:12px;color:#8e9691}
  .lesson-confirm-list{display:flex;flex-direction:column;gap:12px}
  .lc-item{border:1px solid #e7e9e6;border-radius:16px;padding:16px 20px}
  .lc-item .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .lc-item .ttl{font-size:14px;font-weight:700}
  .lc-item .pg{font-size:12px;color:#8e9691}
  .lc-item .st-badge{font-size:11px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}

  /* 学习进度推进 */
  .progress-strip{margin-top:20px;border:1px solid var(--line3);background:var(--card);border-radius:16px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .progress-strip .p-l{display:flex;align-items:center;gap:14px;min-width:0}
  .progress-strip .p-ic{width:40px;height:40px;border-radius:12px;background:var(--blue-soft);color:var(--blue2);display:grid;place-items:center;flex-shrink:0}
  .progress-strip .p-title{font-size:14px;font-weight:700}
  .progress-strip .p-sub{margin-top:2px;font-size:12px;color:#8e9691}
  .progress-strip .p-bar{flex:1;max-width:280px;height:8px;border-radius:999px;background:#eef0ed;overflow:hidden}
  .progress-strip .p-fill{height:100%;background:var(--blue);border-radius:999px}
  .progress-strip .p-txt{font-size:12px;color:var(--gray2);white-space:nowrap}
  .next-lesson-btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;background:var(--blue);color:#fff;padding:10px 18px;font-size:14px;font-weight:700;flex-shrink:0}

  /* 新课学习流程 */
  .newlesson-wrap{max-width:720px;margin:0 auto}

  .nl-step h2{margin-top:16px;font-size:22px;font-weight:700}
  .nl-content{margin-top:16px;font-size:15px;line-height:30px;color:var(--ink2)}
  .nl-read-done{margin-top:24px;border-radius:14px;background:var(--green);color:#fff;padding:14px 40px;font-size:16px;font-weight:700;align-self:center;box-shadow:0 8px 20px rgba(46,139,90,.22);transition:.15s}
  .nl-read-done:hover{background:var(--green2)}
  .nl-quiz-item{margin-top:20px;border:1px solid #e7e9e6;border-radius:14px;padding:16px 20px}

  .nl-options{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .nl-opt{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid #e7e9e6;border-radius:10px;padding:10px 14px;font-size:13px;color:var(--ink3);cursor:pointer;transition:.12s}

  .nl-opt.sel{border-color:var(--blue3);background:var(--blue-soft2)}

  .nl-result{margin-top:20px;border-radius:14px;padding:18px 22px;font-size:14px;line-height:24px;display:none}
  .nl-result.pass{display:block;background:var(--green-soft2);color:#3d5e4b}
  .nl-result.fail{display:block;background:#fff3f0;color:#704a44}
  .nl-result .r-head{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
  .nl-result .r-body{margin-top:8px}
  .nl-retry{margin-top:16px;border-radius:12px;background:var(--orange);color:#fff;padding:10px 24px;font-size:14px;font-weight:700}

  /* 沉浸式「不懂就问」 */

  .nl-read-top{max-width:1120px;margin:0 auto 20px;display:flex;align-items:center;justify-content:space-between}
  .nl-read-hint{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--gray2)}
  .nl-reader{border:1px solid var(--line3);background:var(--card);border-radius:20px;padding:28px;display:flex;flex-direction:column;box-shadow:0 2px 12px rgba(32,39,35,.04)}
  .nl-reader-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--gray2);margin-bottom:16px}
  .nl-unit{display:inline-block;border-radius:999px;background:var(--blue-soft);color:var(--blue2);padding:5px 12px;font-size:13px;font-weight:700}
  .nl-page{flex:1;border:1px solid #eceee9;border-radius:18px;padding:40px 44px;background:linear-gradient(180deg,#fffdfb 0%,#fff 100%);min-height:420px;box-shadow:0 1px 0 #fff inset,0 6px 20px rgba(32,39,35,.05)}
  .nl-page h2{margin:0;font-size:30px;font-weight:700;letter-spacing:.5px}
  .nl-page .nl-content{margin-top:24px;font-size:17px;line-height:2.05;color:var(--ink);letter-spacing:.3px}

  .nl-chat{border:1px solid var(--line3);background:var(--card);border-radius:20px;display:flex;flex-direction:column;min-height:360px}
  .nl-chat-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid #edeef1;font-size:13px;font-weight:700;color:var(--blue2)}

  .nl-quick{padding:10px 16px;border-top:1px solid #edeef1;font-size:12px;color:var(--blue2);cursor:pointer}
  .nl-chat-input{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #edeef1}
  .nl-chat-input input{flex:1;border:1px solid var(--line3);border-radius:12px;padding:10px 12px;font-size:13px;font-family:inherit}
  .send-btn{border-radius:12px;background:var(--blue);color:#fff;padding:10px 16px;font-size:13px;font-weight:700}
  @media(max-width:900px){.nl-immersive{grid-template-columns:1fr}}

  /* 基础知识分类 */
  .kp-cat{margin-top:16px;border:1px solid #eef0ed;border-radius:12px;padding:12px 14px}
  .kp-cat-name{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:8px}

  /* 学习笔记 */
  .nl-page{cursor:text}
  .nl-note-tip{margin-top:14px;font-size:12px;color:var(--blue2);background:var(--blue-soft2);border-radius:10px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}

  .nl-notes-count{font-size:12px;font-weight:600;color:var(--gray2);background:#eef0ed;border-radius:999px;padding:2px 10px}

  /* 沉浸式阅读：pdf.js 文本层 + 选中气泡 + 出处按钮 */
  /* 对齐 DeepTutor globals.css 的 .textLayer：pdf.js 6.x 靠这套 CSS 变量 + 绝对定位
     把每个 span 精确摆到字形位置。KnoAct 原来只有 white-space/transform-origin，缺失了
     position:absolute 和 --text-scale-factor/--min-font-size-inv，导致文本层与 PNG 视觉层
     错位、文字叠成一团、划线/高亮对不齐。 */
  .pdf-page .pdf-text-layer{
    position:absolute;inset:0;overflow:clip;opacity:1;
    line-height:1;text-align:initial;letter-spacing:normal;word-spacing:normal;
    text-size-adjust:none;forced-color-adjust:none;
    transform-origin:0 0;caret-color:CanvasText;z-index:0;
    --min-font-size:1;
    --text-scale-factor:calc(var(--total-scale-factor,1)*var(--min-font-size));
    --min-font-size-inv:calc(1/var(--min-font-size));
  }
  .pdf-page .pdf-text-layer span,
  .pdf-page .pdf-text-layer br{
    color:transparent;position:absolute;white-space:pre;cursor:text;
    transform-origin:0% 0%;user-select:text;
  }
  .pdf-page .pdf-text-layer > :not(.markedContent),
  .pdf-page .pdf-text-layer .markedContent span:not(.markedContent){
    z-index:1;--font-height:0;--scale-x:1;--rotate:0deg;
    font-size:calc(var(--text-scale-factor)*var(--font-height));
    transform:rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv));
  }
  .pdf-page .pdf-text-layer .markedContent{display:contents}
  .pdf-page .pdf-text-layer ::selection{background:rgb(59 130 246 / .32)}
  /* 划线/高亮墨迹层：绝对定位铺在文本层上方，mix-blend-multiply 荧光笔效果，不盖住文字 */
  .pdf-page .pdf-annot-layer{position:absolute;inset:0;pointer-events:none;z-index:2}
  .pdf-page .pdf-annot-layer .ann-mark{position:absolute;border-radius:2px;mix-blend-mode:multiply;pointer-events:auto;cursor:pointer}
  .pdf-page .pdf-annot-layer .ann-mark.underline{background:none;mix-blend-mode:normal;border-bottom:2px solid}
  .pdf-page .pdf-annot-flash{position:absolute;border-radius:2px;mix-blend-mode:multiply;background:rgb(96 165 250/.3);animation:pdf-flash 1.5s ease-out forwards;z-index:3}
  @keyframes pdf-flash{0%,22%{background:rgb(96 165 250/.62);box-shadow:0 0 0 3px rgb(96 165 250/.55)}100%{background:rgb(96 165 250/.3);box-shadow:0 0 0 1px rgb(96 165 250/.28)}}
  .ans .citation{display:inline;border:none;background:var(--blue-soft);color:var(--blue2);border-radius:6px;padding:1px 6px;font-size:12px;font-weight:600;margin:0 2px}

  /* ===== 选中气泡工具栏（对齐 DeepTutor AnnotationPopover：浅色卡片 + 图标按钮 + 色板）===== */
  #reader-popover{position:fixed;z-index:60;background:#fff;border:1px solid #e3e6e2;border-radius:12px;padding:7px;box-shadow:0 10px 30px -12px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:6px;max-width:min(360px,92vw)}
  #reader-popover .rp-row{display:flex;align-items:center;gap:4px}
  #reader-popover .rp-sep{width:1px;height:20px;background:#e3e6e2;margin:0 3px;flex:none}
  #reader-popover .rp-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border:none;border-radius:8px;background:transparent;color:#5a635c;cursor:pointer;transition:background .12s,color .12s}
  #reader-popover .rp-btn:hover{background:#f1f3ef;color:#2b332e}
  #reader-popover .rp-btn.ask{width:auto;height:28px;padding:0 11px;gap:5px;background:var(--blue2,#3158e8);color:#fff;font-size:12px;font-weight:600;border-radius:8px}
  #reader-popover .rp-btn.ask:hover{background:#2447c7;color:#fff}
  #reader-popover .rp-chip{height:28px;padding:0 9px;border:none;border-radius:8px;background:transparent;color:#5a635c;font-size:12px;font-weight:500;cursor:pointer;transition:background .12s,color .12s}
  #reader-popover .rp-chip:hover{background:#f1f3ef;color:#2b332e}
  #reader-popover .rp-swatch{width:20px;height:20px;border-radius:50%;border:1px solid rgba(0,0,0,.1);cursor:pointer;transition:transform .12s,border-color .12s}
  #reader-popover .rp-swatch:hover{transform:scale(1.08)}
  #reader-popover .rp-swatch.on{border-color:#2b332e;transform:scale(1.1)}
  #reader-popover .rp-swatches{display:flex;align-items:center;gap:5px;padding:0 2px}
  #reader-popover .rp-quote{max-width:240px;padding:0 4px;font-size:11px;font-style:italic;color:#8e9691;line-height:1.5;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  #reader-popover .rp-note-row{display:none;flex-direction:column;gap:6px}
  #reader-popover .rp-note-row textarea{width:100%;min-height:60px;resize:none;border:1px solid #e3e6e2;border-radius:8px;padding:7px 9px;font-size:12px;font-family:inherit;line-height:1.5;color:#2b332e;outline:none;background:#fff}
  #reader-popover .rp-note-row textarea:focus{border-color:var(--blue2,#3158e8)}
  #reader-popover .rp-note-actions{display:flex;justify-content:flex-end;gap:6px}
  #reader-popover .rp-note-actions button{padding:4px 10px;border-radius:7px;font-size:11px;cursor:pointer}
  #reader-popover .rp-cancel{background:transparent;color:#8e9691}
  #reader-popover .rp-cancel:hover{background:#f1f3ef;color:#2b332e}
  #reader-popover .rp-save{background:var(--blue2,#3158e8);color:#fff;font-weight:600}
  #reader-popover .rp-save:hover{background:#2447c7}

  /* 课文搜索下拉 */
  .lesson-select{margin-top:12px}
  .lesson-search{display:flex;align-items:center;gap:8px;border:1px solid #e3e6e2;border-radius:10px;padding:9px 12px;background:#fff;color:#8e9691}
  .lesson-search input{flex:1;border:none;outline:none;font-size:13px;color:#2b332e;background:transparent}
  .lesson-search input::placeholder{color:#b0b8b2}
  .ls-clear{border:none;background:#eef0ed;color:#78817b;width:20px;height:20px;border-radius:50%;font-size:14px;line-height:1;cursor:pointer;flex:none}
  .ls-clear:hover{background:#e3e6e2;color:#2b332e}
  .lesson-options{display:flex;flex-direction:column;gap:4px;margin-top:8px;max-height:260px;overflow-y:auto}
  .lesson-option{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border:1px solid transparent;border-radius:9px;background:transparent;cursor:pointer;text-align:left;transition:background .12s}
  .lesson-option:hover{background:#f4f5f2}
  .lesson-option.active{background:var(--blue-soft);border-color:rgba(49,88,232,.25)}
  .lo-title{font-size:13px;color:#2b332e;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lesson-option.active .lo-title{color:var(--blue2);font-weight:600}
  .lo-pages{font-size:11px;color:#8e9691;flex:none}
  .lo-empty{padding:16px 12px;text-align:center;color:#8e9691;font-size:13px}

  /* 阅读模式切换 */
  .read-mode-bar{display:flex;gap:8px;margin-top:14px}
  .rm-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border:1px solid #e3e6e2;border-radius:10px;background:#fff;color:#4b544e;font-size:13px;font-weight:600;cursor:pointer;transition:all .12s}
  .rm-btn:hover{border-color:#c9cfca}
  .rm-btn.active{background:var(--blue-soft);border-color:rgba(49,88,232,.25);color:var(--blue2)}

  /* ===== 全屏沉浸页 —— 三栏布局（目录 / 阅读器 / 对话），对齐 DeepTutor ===== */
  .immersive{position:fixed;inset:0;z-index:40;background:var(--bg, #f4f5f2);display:flex;flex-direction:column;font-size:14px;color:#2b332e}
  /* 顶部 44px 工具栏 */
  .im-top{display:flex;align-items:center;gap:6px;height:44px;flex:none;padding:0 10px;background:#fff;border-bottom:1px solid #eef0ed}
  .im-top .im-grow{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
  .im-title{font-size:13.5px;font-weight:600;color:#2b332e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .im-sub{font-size:11.5px;color:#8e9691;white-space:nowrap}
  /* 图标工具按钮（返回/目录开关/朗读/测验/全屏/菜单/新对话/对话开关） */
  .im-tool{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:none;border-radius:7px;background:transparent;color:#5a635c;cursor:pointer;transition:background .12s}
  .im-tool:hover{background:#f1f3ef;color:#2b332e}
  .im-tool.active{background:#eaf0ff;color:var(--blue2,#3158e8)}
  .im-back{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px;border:none;border-radius:7px;background:transparent;color:#5a635c;font-size:13px;font-weight:600;cursor:pointer;transition:background .12s}
  .im-back:hover{background:#f1f3ef;color:#2b332e}
  .im-divider{width:1px;height:20px;background:#eef0ed;margin:0 4px;flex:none}
  /* 三栏主体（列宽由 JS 内联 grid-template-columns 控制，可拖拽） */
  .im-body{display:grid;grid-template-columns:200px 5px minmax(0,1fr) 5px 380px;gap:0;flex:1;min-height:0}
  /* 左栏：目录导航 */
  .im-nav{overflow-y:auto;background:#fafbf9;border-right:1px solid #eef0ed;padding:10px 0;min-height:0;min-width:0}
  .im-nav .nav-head{padding:4px 16px 8px;font-size:11px;font-weight:700;color:#8e9691;text-transform:uppercase;letter-spacing:.04em}
  .im-nav-item{display:flex;align-items:flex-start;gap:8px;width:100%;padding:7px 14px;border:none;background:transparent;text-align:left;cursor:pointer;color:#4b544e;font-size:13px;line-height:1.4;transition:background .12s}
  .im-nav-item:hover{background:#f1f3ef}
  .im-nav-item.active{background:#eaf0ff;color:var(--blue2,#3158e8);font-weight:600}
  .im-nav-item .ni-idx{flex:none;width:18px;text-align:right;font-size:11px;color:#aab1ab;tabular-nums;margin-top:2px}
  .im-nav-item.active .ni-idx{color:var(--blue2,#3158e8)}
  .im-nav-item .ni-title{min-width:0;flex:1}
  /* 中栏：阅读器（书桌色对齐 DeepTutor --secondary 暖米色 #f5f2ea，让白纸「浮」起来） */
  .im-reader{overflow-y:auto;overscroll-behavior:contain;background:#f5f2ea;min-height:0;min-width:0}
  .im-reader .reader-pad{padding:16px 24px 64px}
  /* 拖拽分隔条（窄条，中央一条竖线，hover/拖拽高亮） */
  .im-sep{position:relative;cursor:col-resize;background:#f2f4f1;min-height:0;touch-action:none}
  .im-sep::after{content:'';position:absolute;top:0;bottom:0;left:50%;width:1px;transform:translateX(-50%);background:#e3e6e2;transition:background .12s,width .12s}
  .im-sep:hover::after,.im-sep.dragging::after{background:var(--blue2,#3158e8);width:2px}
  /* 右栏：对话伴学 */
  .im-side{display:flex;flex-direction:column;min-height:0;background:#fff;border-left:1px solid #eef0ed;min-width:0}
  .im-chat-head{flex:none;height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid #f0f2ef}
  .im-chat-head .t{font-family:Georgia,"Songti SC","SimSun",serif;font-size:13.5px;font-weight:600;color:#2b332e}
  .im-chat-head .sub{font-size:11px;color:#8e9691}
  .im-chat-body{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  /* 消息气泡 */
  .im-msg{display:flex;flex-direction:column;max-width:100%}
  .im-msg.user{align-items:flex-end}
  .im-msg.ai{align-items:flex-start}
  .im-msg .bubble{padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.65;max-width:94%;word-break:break-word}
  .im-msg.user .bubble{background:var(--blue2,#3158e8);color:#fff;border-bottom-right-radius:4px}
  .im-msg.ai .bubble{background:#f3f5f2;color:#2b332e;border-bottom-left-radius:4px;white-space:pre-wrap}
  .im-msg .meta{font-size:10.5px;color:#aab1ab;margin:4px 2px 0}
  .im-msg .mm-tag{align-self:flex-start;font-size:10px;color:#7c86d8;background:#eef2ff;border-radius:6px;padding:1px 6px;margin-bottom:2px}
  .im-msg.ai .bubble .citation{display:inline;margin:0 1px;padding:0 4px;border:none;border-radius:4px;background:#dde6ff;color:var(--blue2,#3158e8);font-size:12px;cursor:pointer}
  /* 空态欢迎（对齐 DeepTutor CompanionWelcome：衬线标题 + 插图 + 说明）*/
  .im-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:#aab1ab;text-align:center;padding:24px}
  .im-empty .mark{width:64px;height:72px;margin-bottom:16px;color:#c4cac6}
  .im-empty .mark svg{width:100%;height:100%;overflow:visible}
  .im-empty .big{font-family:Georgia,"Songti SC","SimSun",serif;font-size:18px;font-weight:600;color:#2b332e;letter-spacing:-.01em;margin-bottom:8px}
  .im-empty .hint{font-size:12.5px;line-height:1.7;max-width:250px;color:#8e9691}
  /* 底部输入区（浮动在对话之上） */
  .im-composer{flex:none;padding:10px 14px 12px;border-top:1px solid #f0f2ef;background:linear-gradient(to bottom, rgba(255,255,255,0) 0, #fff 32px)}
  .im-composer .quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .im-composer .qa-btn{flex:none;padding:5px 11px;border:1px solid #e3e6e2;border-radius:999px;background:#fff;color:#4b544e;font-size:12px;cursor:pointer;transition:all .12s}
  .im-composer .qa-btn:hover{border-color:#c9cfca;background:#fafbf9}
  .im-composer .row{display:flex;align-items:flex-end;gap:8px}
  .im-composer textarea{flex:1;min-height:40px;max-height:120px;resize:none;border:1px solid #e3e6e2;border-radius:12px;padding:10px 13px;font-size:13.5px;font-family:inherit;line-height:1.5;color:#2b332e;background:#fff;outline:none}
  .im-composer textarea:focus{border-color:var(--blue2,#3158e8)}
  .im-composer .send-btn{flex:none;width:40px;height:40px;border:none;border-radius:12px;background:var(--blue2,#3158e8);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .12s}
  .im-composer .send-btn:hover{background:#2447c7}
  .im-composer .send-btn:disabled{background:#c4cbce;cursor:not-allowed}
  /* 模型/模式 chip 行 */
  .im-chips{position:relative;display:flex;gap:6px;align-items:center;margin-bottom:8px}
  .im-chip{position:relative;display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid #e3e6e2;border-radius:999px;background:#fff;color:#4b544e;font-size:12px;cursor:pointer;transition:all .12s;user-select:none}
  .im-chip:hover{border-color:#c9cfca;background:#fafbf9}
  .im-chip.on{border-color:var(--blue2,#3158e8);color:var(--blue2,#3158e8);background:#eef2ff}
  .im-chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
  .im-chip .caret{margin-left:2px;opacity:.55}
  .im-menu{position:absolute;bottom:calc(100% + 6px);left:0;min-width:180px;max-height:280px;overflow:auto;background:#fff;border:1px solid #e3e6e2;border-radius:12px;box-shadow:0 8px 24px rgba(20,30,25,.12);padding:5px;z-index:60}
  .im-menu .mi{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:13px;color:#2b332e;cursor:pointer}
  .im-menu .mi:hover{background:#f3f5f2}
  .im-menu .mi.on{background:#eef2ff;color:var(--blue2,#3158e8);font-weight:600}
  .im-menu .mi .mi-desc{font-size:11px;color:#8e9691;font-weight:400}
  .im-menu .mi.on .mi-desc{color:#7c86d8}
  .im-menu .mi .mi-name{flex:1}
  /* mermaid 图在气泡里的样式 */
  .im-msg.ai .bubble .mmd{white-space:normal;display:block;margin:8px 0;overflow:auto;background:#fff;border:1px solid #e3e6e2;border-radius:10px;padding:10px;text-align:center}
  .im-msg.ai .bubble .mmd svg{max-width:100%;height:auto}
  .im-msg.ai .bubble .mmd svg .error-icon,.im-msg.ai .bubble .mmd svg .error-text{display:none!important}
  .im-msg.ai .bubble .mmd-src{font-size:11px;text-align:left;white-space:pre-wrap;color:#4b544e;margin:0;padding:8px;background:#f7f8f7;border-radius:6px;max-height:200px;overflow:auto}
  /* 动画渲染进度 / 视频卡片 */
  .render-card{margin-top:6px;max-width:94%}
  .render-card video{display:block;border-radius:10px;background:#000}
  .render-progress{font-size:11.5px;color:#8e9691;background:#f3f5f2;border-radius:8px;padding:4px 10px;display:inline-block}
  /* 思考过程折叠卡片（仿 DeepTutor ModelThinkingCard） */
  .thinking-card{margin-top:6px;max-width:94%;border:1px solid #e3e6e2;border-radius:10px;background:#fafbfa;overflow:hidden}
  .thinking-card summary{display:flex;align-items:center;gap:6px;padding:5px 10px;font-size:11.5px;font-weight:500;color:#8e9691;cursor:pointer;list-style:none;user-select:none}
  .thinking-card summary::-webkit-details-marker{display:none}
  .thinking-card summary svg{flex:none;opacity:.8}
  .thinking-card .thinking-body{border-top:1px solid #eef0ee;padding:8px 10px;font-size:12px;line-height:1.6;color:#5a635c;white-space:pre-wrap;word-break:break-word}
  /* 引用上下文提示条 */
  .im-ctx{flex:none;display:flex;align-items:center;gap:6px;margin:0 14px 8px;padding:6px 10px;border-radius:8px;background:#f3f6ff;border:1px solid #e0e8ff;color:#5a635c;font-size:12px}
  .im-ctx .q{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .im-ctx .x{cursor:pointer;color:#8e9691}
  .pdf-page-slot{min-height:120px}

  @media(max-width:1024px){
    .sidebar{display:none}
    .main{margin-left:0;padding:20px}
    .hero-grid,.review-grid,.pl-grid{grid-template-columns:1fr}
    .task-grid,.stats-grid{grid-template-columns:1fr}
    .wrong-ans{grid-template-columns:1fr}
  }

  /* 模型与服务：左角色导航 + 右配置面板 */
  .ms-wrap{display:grid;grid-template-columns:236px minmax(0,1fr);gap:20px;margin-top:24px;align-items:start}
  .ms-nav{border:1px solid var(--line3);background:var(--card);border-radius:20px;padding:12px;position:sticky;top:24px}
  .ms-nav .nav-title{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--gray3);padding:8px 10px 10px}
  .ms-item{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:12px;font-size:13px;font-weight:600;color:var(--ink3);text-align:left;transition:.15s}
  .ms-item:hover{background:#f5f6f4}
  .ms-item.on{background:var(--blue-soft);color:var(--blue)}
  .ms-item .dot{width:6px;height:6px;border-radius:50%;margin-left:auto;flex-shrink:0}
  .ms-item .dot.ok{background:var(--green2)}
  .ms-item .dot.warn{background:var(--gold2)}
  .ms-item .dot.off{background:#d7dcd6}
  .ms-item .off-tag{margin-left:auto;font-size:10px;color:var(--gray3);font-weight:500;background:#f3f5f2;border-radius:6px;padding:2px 6px}
  .ms-main{border:1px solid var(--line3);background:var(--card);border-radius:24px;padding:24px}
  .ms-main .head{display:flex;align-items:center;gap:12px}
  .ms-main .head .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
  .ms-main .head .ic.blue{background:var(--blue-soft);color:var(--blue2)}
  .ms-main .head .ic.green{background:var(--green-soft);color:var(--green2)}
  .ms-main .head .ic.purple{background:var(--purple-soft);color:var(--purple)}
  .ms-main .head .ic.orange{background:var(--orange-soft);color:var(--orange2)}
  .ms-main .head h3{font-size:16px;font-weight:700}
  .ms-main .head .sub{margin-top:2px;font-size:12px;color:#8e9691}
  .ms-field{margin-top:18px;max-width:560px}
  .ms-label{font-size:13px;color:var(--gray2);margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .ms-input,.ms-select{width:100%;border:1px solid var(--line3);border-radius:12px;padding:10px 12px;font-size:13px;font-family:inherit;background:var(--card);color:var(--ink)}
  .ms-input:focus,.ms-select:focus{outline:none;border-color:var(--blue-border);box-shadow:0 0 0 3px rgba(49,88,232,.08)}
  .ms-input:disabled,.ms-select:disabled{background:#f7f8f6;color:var(--gray3)}
  .ms-row{display:flex;gap:10px;align-items:center}
  .ms-hint{font-size:12px;color:var(--gray3);margin-top:6px;line-height:19px}
  .ms-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;margin-left:auto}
  .ms-badge.ok{background:var(--green-soft);color:var(--green)}
  .ms-badge.idle{background:#f3f5f2;color:var(--gray3)}
  .ms-badge.warn{background:var(--orange-soft);color:var(--orange2)}
  .ms-card{border:1px solid #e7e9e6;border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}
  .ms-card+.ms-card{margin-top:10px}
  .ms-card .c-l{min-width:0;flex:1}
  .ms-card .c-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
  .ms-card .c-meta{margin-top:3px;font-size:12px;color:#8e9691;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ms-card .c-k{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--gray3)}
  .ms-empty{border:1px dashed #dfe4dd;border-radius:16px;padding:28px 16px;text-align:center;font-size:13px;color:var(--gray3)}
  .ms-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid #eef1ec}
  @media(max-width:820px){ .ms-wrap{grid-template-columns:1fr} .ms-nav{position:static} }
  .quiz-card{border:1px solid var(--line3);border-radius:16px;padding:14px;margin:10px 0;background:var(--card)}
  .quiz-q{margin-bottom:14px}
  .qq-prompt{font-size:14px;font-weight:600;margin-bottom:8px}
  .qq-choice{display:block;padding:9px 12px;border:1px solid var(--line3);border-radius:10px;margin-top:6px;font-size:13px;cursor:pointer;transition:.12s}
  .qq-choice:hover{background:#f5f6f4}
  .qq-choice.on{border-color:var(--blue-border);background:var(--blue-soft);color:var(--blue)}
  .qq-choice.ok{border-color:var(--green2);background:var(--green-soft)}
  .qq-choice.bad{border-color:#c05b4a;background:#fdf0ee}
  .quiz-card.submitted .qq-choice{cursor:default;pointer-events:none}
  .quiz-foot{margin-top:12px;display:flex;justify-content:flex-end;align-items:center;gap:10px;font-size:13px;font-weight:600}
  .lc-row{margin-bottom:14px}
  .lc-label{display:block;font-size:13px;font-weight:600;color:#4c554f;margin-bottom:6px}
  .lc-input{width:100%;max-width:280px;border:1px solid var(--line3);border-radius:10px;padding:8px 12px;font-size:13px;background:var(--card)}
  .lc-input:focus{outline:none;border-color:var(--blue-border)}
  .lc-hint{margin-top:4px;font-size:12px;color:#8e9691}
</style>
</head>

<!-- 改 app.js 后把 v= 后面的数字 +1，避免 127.0.0.1 / localhost 各自缓存旧脚本 -->
<!-- pdf.js 本地化（对齐 DeepTutor 的 pdfjs-dist 6.x legacy 构建 + 同源 worker/wasm），
     用 module 动态 import 挂到 window.pdfjsLib，避免 CDN 跨域导致内嵌 CJK 字体 canvas 渲染挂起。 -->
<script type="module">
  import * as pdfjsLib from './vendor/pdfjs/build/pdf.mjs';
  if(!pdfjsLib.GlobalWorkerOptions.workerSrc){
    pdfjsLib.GlobalWorkerOptions.workerSrc = new URL('./vendor/pdfjs/build/pdf.worker.min.mjs', import.meta.url).href;
  }
  window.pdfjsLib = pdfjsLib;
  window.pdfjsWasmUrl = new URL('./vendor/pdfjs/wasm/', import.meta.url).href;
</script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
