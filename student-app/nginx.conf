server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;

    # .mjs 以 ES module 加载，必须返回 JavaScript MIME，否则浏览器拒绝执行
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
    }

    location /api/ {
        proxy_pass http://backend:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        # 听力/阅读材料与 TTS 可能当场调用大模型生成
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /uploads/ {
        proxy_pass http://backend:8010;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://backend:8010;
    }

    # 发版后浏览器须拿到新版本：Flutter Web 产物文件名不带哈希，入口、引导脚本与资源均不缓存
    location ~ ^/(index\.html|flutter\.js|flutter_bootstrap\.js|flutter_service_worker\.js|main\.dart\.js|manifest\.json|version\.json)$ {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 自带的 CanvasKit 同样不带哈希；其中 .mjs 走上面的正则 location，不受此处约束
    location /canvaskit/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
