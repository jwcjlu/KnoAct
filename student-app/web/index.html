<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="知学伴学生端：小学生的 AI 学习伙伴">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="知学伴">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>知学伴 · 学生端</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    #boot-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;background:#f6f7f5;color:#5a625d}
    #boot-splash .spin{width:32px;height:32px;border:3px solid #dde1dc;border-top-color:#3158e8;border-radius:50%;animation:bootrot .8s linear infinite}
    @keyframes bootrot{to{transform:rotate(360deg)}}
  </style>
  <div id="boot-splash"><div class="spin"></div><p style="margin-top:12px;font-size:14px">知学伴加载中…</p><p style="font-size:12px;opacity:.75">首次调试启动可能需 1～2 分钟</p></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot-splash');
      if (el) el.remove();
    });
    setTimeout(function () {
      var el = document.getElementById('boot-splash');
      if (el && !document.querySelector('flutter-view, flt-glass-pane, canvas')) {
        var p = el.querySelector('p:last-child');
        if (p) p.textContent = '加载较慢：请稍候或刷新；若长期白屏可重启 flutter run';
      }
    }, 45000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
