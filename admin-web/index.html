<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知学伴 · 运营后台</title>
<style>
  :root{
    --blue:#3158e8; --blue-soft:#edf1ff;
    --bg:#f7f8f5; --card:#fff;
    --ink:#202723; --gray:#78817b; --line:#e3e7e0;
    --green:#2e8b5a; --green-soft:#e8f7ef;
    --orange:#c97629; --red:#c04b3a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
  button,input,select{font-family:inherit;font-size:14px}
  button{cursor:pointer;border:none;background:none}
  .layout{display:flex;min-height:100vh}
  .sidebar{width:220px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column}
  .logo{font-size:17px;font-weight:700;letter-spacing:-.02em;padding:0 8px}
  .logo-sub{font-size:11px;color:var(--gray);margin-top:4px;font-weight:500}
  .nav{margin-top:32px;display:flex;flex-direction:column;gap:6px}
  .nav-item{width:100%;text-align:left;padding:10px 12px;border-radius:10px;font-weight:600;color:#5a635c}
  .nav-item.on{background:var(--blue-soft);color:var(--blue)}
  .sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--gray)}
  .sidebar-foot .who{font-weight:600;color:var(--ink);margin-bottom:8px}
  .main{flex:1;padding:28px 32px 48px;max-width:1200px}
  .page-head h1{font-size:26px;font-weight:700}
  .page-head p{margin-top:6px;font-size:14px;color:var(--gray)}
  .toolbar{margin-top:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .toolbar select,.toolbar input{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
  .btn-primary{border-radius:10px;background:var(--blue);color:#fff;padding:8px 16px;font-weight:600}
  .btn-primary:disabled{opacity:.5;cursor:default}
  .btn-ghost{border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600;color:#4b544e}
  .btn-ghost:hover{background:#f3f5f2}
  .btn-danger{color:var(--red);border-color:#f1d5cf}
  .panel{margin-top:20px;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:20px}
  .panel h2{font-size:15px;font-weight:700;margin-bottom:14px}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .field label{display:block;font-size:12px;color:var(--gray);margin-bottom:6px}
  .field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .form-actions{margin-top:14px;display:flex;justify-content:flex-end;gap:8px}
  .table-wrap{margin-top:20px;border:1px solid var(--line);background:var(--card);border-radius:16px;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #eef0ed;white-space:nowrap}
  th{font-size:12px;color:var(--gray);font-weight:600;background:#fafbf9}
  tr:last-child td{border-bottom:none}
  .tag{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700}
  .tag.child{background:var(--blue-soft);color:var(--blue)}
  .tag.parent{background:#fff2df;color:var(--orange)}
  .tag.admin{background:#f0edff;color:#7457d7}
  .tag.archived{background:#f3f5f2;color:var(--gray)}
  .tag.active{background:var(--green-soft);color:var(--green)}
  .row-actions{display:flex;gap:6px}
  .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
  .login-card{width:100%;max-width:400px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:32px 28px;box-shadow:0 8px 30px rgba(32,39,35,.06)}
  .login-card h1{font-size:22px;font-weight:700}
  .login-card p{margin-top:8px;font-size:13px;color:var(--gray);line-height:1.6}
  .login-card .field{margin-top:16px}
  .login-card .btn-primary{width:100%;margin-top:20px;padding:11px}
  .login-hint{margin-top:14px;font-size:12px;color:#9aa39c;line-height:1.5}
  .empty{padding:40px;text-align:center;color:var(--gray);font-size:14px}
  .toast{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:50;border-radius:999px;background:#202c28;color:#fff;padding:12px 20px;font-size:14px;font-weight:600;box-shadow:0 20px 25px -5px rgba(0,0,0,.2);display:none}
  @media(max-width:820px){
    .layout{flex-direction:column}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line)}
    .main{padding:20px 16px 40px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script src="config.js?v=1"></script>
<script src="app.js?v=1"></script>
</body>
</html>
